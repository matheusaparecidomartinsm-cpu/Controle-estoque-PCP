<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Controle Estoque PCP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Painel no estilo Power BI: barra fixa no topo com as abas, filtros na lateral e uma página por vez.
   Azul é a cor principal; verde, laranja e vermelho só para a situação (em dia, atenção, crítico). */
:root{
  --bg:#1a1d2e;          /* fundo */
  --panel:#242740;       /* painéis, barra do topo, lateral */
  --surface:#242740;
  --card:#2d3154;        /* cards */
  --surface-2:#2d3154;
  --raise:#313660;       /* linha com o mouse em cima */
  --line:#3a3f6b;        /* bordas */
  --rule:rgba(58,63,107,.55); /* divisórias das linhas */
  --paper:#e8eaf6;       /* texto */
  --kraft:#8b92c4;       /* texto secundário */
  --dim:#5f6596;
  --azul:#4f8ef7; --roxo:#7c5cbf; --verde:#2ec4a9; --laranja:#f5a623; --vermelho:#e05c5c;
  --accent:#4f8ef7; --accent-ink:#ffffff; --focus:#4f8ef7;
  --falta:#e05c5c;       /* disponível negativo */
  --critico:#f5a623;     /* menos de 20 dias */
  --atencao:#e9c46a;     /* 20 a 39 dias */
  --ok:#2ec4a9;          /* 40 dias ou mais */
  --sem:#8b92c4;         /* sem giro */
  --obs:#c9cdf0;
  --body:'Segoe UI',Arial,sans-serif;
  --display:'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;overflow:hidden}
button,input,select,textarea{font-family:var(--body)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* barra do topo */
.top{position:fixed;top:0;left:0;right:0;z-index:10;height:44px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:26px;height:26px;flex-shrink:0;border-radius:6px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:11px;color:var(--kraft);white-space:nowrap}
.tabs{display:flex;gap:2px;justify-self:center;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--kraft);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s,color .15s}
.tab:hover{background:rgba(79,142,247,.12);color:var(--paper)}
.tab[aria-selected="true"]{background:var(--azul);color:#fff}
.tab span{font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;background:rgba(139,146,196,.18);color:inherit}
.tab[aria-selected="true"] span{background:rgba(255,255,255,.22)}
.topinfo{justify-self:end;display:flex;align-items:center;gap:12px;min-width:0;font-size:12px;color:var(--kraft)}
.live{display:flex;align-items:center;gap:6px;white-space:nowrap}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px rgba(46,196,169,.18);animation:pulse 2s ease-in-out infinite}
.live:empty{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(46,196,169,.05)}}
#conn{display:flex;align-items:center;gap:8px;white-space:nowrap}
#conn .btn{min-height:28px;padding:0 10px;font-size:12px}

/* corpo */
.body{position:fixed;top:44px;left:0;right:0;bottom:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
.lateral{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:18px}
.lateral h2{margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kraft)}
.fgrupo{display:flex;flex-direction:column;gap:2px}
.fgrupo h3{margin:0 0 4px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.fbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;padding:4px 8px;border:0;border-radius:6px;background:transparent;color:var(--paper);font-size:12.5px;text-align:left;cursor:pointer;transition:background-color .15s}
.fbtn:hover{background:rgba(139,146,196,.1)}
.fbtn[aria-pressed="true"]{background:rgba(79,142,247,.18);color:var(--azul);font-weight:700}
.fbtn i{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--kraft)}
.fbtn b{margin-left:auto;font-weight:500;font-size:11px;color:var(--kraft)}
.fbtn[aria-pressed="true"] b{color:var(--azul)}
.flista{max-height:260px;overflow-y:auto}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.search:focus-within{border-color:var(--azul)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--paper);font-size:12.5px}
.search input::placeholder{color:var(--dim)}
.limpar{border:0;background:none;color:var(--azul);font-size:12px;font-weight:600;cursor:pointer;padding:2px 0;text-align:left}
.limpar:hover{text-decoration:underline}
.actions{display:flex;flex-direction:column;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--paper);font-size:12.5px;font-weight:600;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--card);border-color:#4a5088}
.btn.solid{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.solid:hover{background:#6a9ff8;border-color:#6a9ff8}
.btn.quiet{background:transparent}
.btn svg{flex-shrink:0;width:15px;height:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions .btn{width:100%}

.main{overflow:auto;padding:16px 18px 40px}
.page{display:flex;flex-direction:column;gap:14px;max-width:1700px}
.pagecab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.pagecab h2{margin:0;font-size:16px;font-weight:700}
.meta{color:var(--kraft);font-size:12px;margin:0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 14px 16px;border-left:3px solid var(--k,var(--azul));overflow:hidden}
.kpi span{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--kraft)}
.kpi b{display:block;margin-top:4px;font-size:26px;font-weight:700;line-height:1.15;color:var(--paper)}
.kpi small{display:block;margin-top:2px;font-size:11.5px;color:var(--kraft)}
.kpi .barra{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(139,146,196,.15)}
.kpi .barra i{display:block;height:100%;width:0;background:var(--k,var(--azul));transition:width .8s cubic-bezier(.22,.61,.36,1)}

/* cards e grades */
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-cab h3{margin:0;font-size:12px;font-weight:700}
.selo{flex-shrink:0;padding:2px 8px;border-radius:10px;background:rgba(79,142,247,.16);color:var(--azul);font-size:10.5px;font-weight:600}
.chart{position:relative;height:240px}
.chart.alto{height:300px}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--kraft)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:2px}
.vazio{padding:18px 4px;color:var(--kraft);font-size:12.5px;text-align:center}

/* barras de progresso em lista */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:12px}
.prog-l b{font-weight:700}
.trilho{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(139,146,196,.15);overflow:hidden}
.trilho i{display:block;height:100%;width:0;border-radius:3px;transition:width .9s cubic-bezier(.22,.61,.36,1)}

/* cartões de lista */
.lista{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--rule)}
.li:last-child{border-bottom:0}
.av{width:32px;height:32px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff}
.li div{min-width:0;flex:1}
.li strong{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;font-size:11px;color:var(--kraft)}
.li em{font-style:normal;font-size:18px;font-weight:700}

/* pílulas */
.pilula{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:rgba(46,196,169,.15);color:var(--verde)}
.p-at{background:rgba(245,166,35,.15);color:var(--laranja)}
.p-cr{background:rgba(224,92,92,.16);color:var(--vermelho)}
.p-ne{background:rgba(139,146,196,.15);color:var(--kraft)}

/* tabelas */
.sheet{max-height:calc(100vh - 290px);min-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;vertical-align:bottom;padding:8px 9px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.3;color:var(--kraft);border-bottom:1px solid var(--line);white-space:normal}
th.n,td.n{text-align:right}
th.n{width:70px;min-width:60px}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}
th:first-child{z-index:3;min-width:360px;padding-left:14px}
td{padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle;line-height:1.35}
td:first-child{background:var(--card);border-left:3px solid var(--st,var(--sem));padding-left:11px;max-width:420px}
td.obs{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--obs)}
td.dias{font-weight:700}
tr.r{transition:background-color .15s}
tr.r:hover td{background-color:var(--raise)}
tbody tr:last-child td{border-bottom:0}
.item{display:flex;align-items:baseline;gap:8px;min-width:0}
.cod{flex-shrink:0;width:42px;color:var(--kraft);font-size:12px}
.desc{display:block;min-width:0;max-width:300px;padding:2px 0;border:0;background:none;color:var(--paper);font-size:12.5px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.desc:hover{color:var(--azul)}
.muted{color:var(--dim)}
.edt{display:inline-flex;align-items:center;gap:6px;min-height:26px;max-width:150px;overflow:hidden;padding:2px 6px;margin:-2px -6px;border:1px solid transparent;border-radius:5px;background:none;color:inherit;font-size:12.5px;text-align:left;cursor:text;transition:border-color .15s,background-color .15s}
.edt:hover,.edt:focus-visible{border-color:var(--line);background:var(--panel)}
.edt svg{opacity:0;flex-shrink:0;color:var(--kraft);transition:opacity .15s}
.edt:hover svg,.edt:focus-visible svg{opacity:1}
.edt-in{width:130px;min-height:26px;padding:2px 6px;margin:-2px -6px;border:1px solid var(--azul);border-radius:5px;background:var(--bg);color:var(--paper);font-size:12.5px}
.edt-in.salvando{opacity:.6}
.tabsimples{border:0}
.tabsimples th:first-child,.tabsimples td:first-child{position:static;min-width:0;border-left:0;padding-left:9px;background:transparent}
.tabsimples td{background:transparent}
.tabsimples th{position:static;background:transparent}
/* carregamento: cada linha entra da esquerda para a direita */
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.anim td>.v{display:inline-block;clip-path:inset(0 100% 0 0);animation:reveal .22s ease-out forwards;animation-delay:calc(var(--r) + var(--k) + .02s)}
.anim td>.v.item,.v.item{display:flex}
.empty{padding:48px 20px;text-align:center;color:var(--kraft);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty strong{font-size:16px;font-weight:700;color:var(--paper)}

/* janelas */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:.4;transform:translateX(32px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,24,.72);display:flex;animation:fade .2s ease both}
.overlay.center{align-items:center;justify-content:center;padding:16px}
.overlay.side{justify-content:flex-end}
.dialog{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:rise .3s cubic-bezier(.22,.61,.36,1) both;font-size:13.5px}
.dialog h2,.drawer h2{margin:0;font-size:18px;font-weight:700;line-height:1.25;text-wrap:balance}
.dialog .meta,.drawer .meta{font-size:13px;line-height:1.5}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{padding:3px 9px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--card);color:var(--kraft)}
.col.ok{color:var(--verde);background:rgba(46,196,169,.14)}
.col.miss{color:var(--vermelho);background:rgba(224,92,92,.14)}
.warn{margin:0;padding:9px 12px;border-radius:7px;background:rgba(245,166,35,.12);color:#f7c76e;font-size:13px;line-height:1.45}
.err{margin:0;padding:9px 12px;border-radius:7px;background:rgba(224,92,92,.14);color:var(--vermelho);font-size:13px;line-height:1.45}
.prev{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.prev table{min-width:700px;font-size:12px}
.prev th{position:static}
.prev th:first-child,.prev td:first-child{position:static;border-left:0;min-width:0;padding-left:10px}
.row-end{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--azul);flex-shrink:0;margin-top:1px}
.drawer{width:440px;max-width:100%;height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:18px;animation:slide .3s cubic-bezier(.22,.61,.36,1) both;font-size:13px}
.big{display:flex;align-items:baseline;gap:12px;padding:14px 16px;border-radius:8px;background:var(--card);border-left:4px solid var(--sem)}
.big b{font-size:40px;font-weight:700;line-height:1}
dl{margin:0;border-radius:8px;border:1px solid var(--line);padding:2px 12px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13px}
dl div:last-child{border-bottom:0}
dt{color:var(--kraft)}
dd{margin:0;text-align:right;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:3px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.seg button{min-height:34px;border-radius:6px;border:0;background:transparent;color:var(--kraft);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--azul);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--kraft)}
.field input,.field textarea,.field select{min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--paper);font-size:13.5px}
.close{width:36px;height:36px;flex-shrink:0;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center}
.close:hover{background:var(--card)}
.login{max-width:380px;align-items:stretch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:min(440px,calc(100% - 32px));padding:11px 14px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--verde);background:var(--card);color:var(--paper);font-size:13px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,.45);animation:rise .3s cubic-bezier(.22,.61,.36,1) both}
.toast.bad{border-left-color:var(--vermelho)}

/* ações de hoje */
.acoes{display:flex;flex-direction:column;gap:14px}
.plano{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;padding:12px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.plano .btn{margin-left:auto}
.plano-campo{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--kraft)}
.plano-campo span{display:flex;align-items:center;gap:8px;color:var(--paper);font-size:12.5px}
.plano-campo input{width:68px;min-height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--paper);font-size:13px;font-variant-numeric:tabular-nums}
.acoes-bloco{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.acoes-cab h2{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.acoes-cab h2 span{padding:1px 8px;border-radius:10px;background:rgba(79,142,247,.16);color:var(--azul);font-size:11px}
.acoes-cab .meta{margin-top:4px;max-width:820px}
.acoes-sheet{max-height:none;min-height:0}
.acoes-sheet th:first-child{min-width:330px}
.acoes-vazio{margin:0;padding:14px;border-radius:7px;background:rgba(139,146,196,.08);color:var(--kraft);font-size:12.5px}
td.sug{font-weight:700;color:var(--paper)}
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:5px;background:rgba(224,92,92,.14);color:var(--vermelho);font-size:11px;font-weight:600}

@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  body{overflow:auto}
  .top{position:sticky;height:auto;grid-template-columns:1fr auto;grid-template-areas:"brand info" "tabs tabs";padding-top:8px;padding-bottom:6px;row-gap:6px}
  .brand{grid-area:brand}.topinfo{grid-area:info}.tabs{grid-area:tabs;justify-self:stretch}
  .brand small,.live{display:none}
  .body{position:static;display:block}
  .lateral{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;gap:12px;overflow:visible}
  .lateral{gap:8px;padding:10px 14px 12px}
  .lateral>*{flex:1 1 100%}
  .lateral h2{margin-bottom:6px}
  .fgrupo,.flista{flex-direction:row;display:flex;gap:6px;overflow-x:auto;max-height:none;scrollbar-width:none;padding-bottom:2px}
  .fgrupo h3{display:none}
  .fbtn{width:auto;flex-shrink:0;white-space:nowrap;border:1px solid var(--line);min-height:30px}
  .fbtn b{margin-left:4px}
  .actions{flex-direction:row;flex-wrap:wrap}.actions .btn{flex:1 1 calc(50% - 4px);justify-content:center}
  .main{overflow:visible;padding:12px max(14px,env(safe-area-inset-left,0px)) 40px}
  .g2,.g3,.g21{grid-template-columns:minmax(0,1fr)}
  th:first-child{min-width:220px}.desc{max-width:170px}td:first-child{max-width:250px}
  .sheet{max-height:none;min-height:0}
  .plano .btn{margin-left:0;width:100%;justify-content:center}
}

<script>
(function () {
  const ST = {
    falta: { label: 'Em falta', cor: 'var(--falta)', bg: 'rgba(224,92,92,.17)' },
    critico: { label: 'Crítico', cor: 'var(--critico)', bg: 'rgba(245,166,35,.14)' },
    atencao: { label: 'Atenção', cor: 'var(--atencao)', bg: 'rgba(233,196,106,.11)' },
    ok: { label: 'Em dia', cor: 'var(--ok)', bg: 'transparent' },
    sem: { label: 'Sem giro', cor: 'var(--sem)', bg: 'transparent' }
  };
  const ORDER = ['falta', 'critico', 'atencao', 'ok', 'sem'];
  const CLI = [['BATEL GRILL','Batel Grill'],['MR FRITZ','Mr. Fritz'],['CACHORRAO','Cachorrão do Claudião'],['CACHORRÃO','Cachorrão do Claudião'],['BUTECO','Buteco Seu Rufino'],['MANE','Mané'],['MANÉ','Mané'],['SODIE','Sodiê'],['SODIÊ','Sodiê'],['JAH','Jah Açaí'],['THE BEST','The Best Açaí'],['THE BETS','The Best Açaí'],['ESPETTO','Espetto Carioca'],['COCO BAMBU','Coco Bambu'],['ALEMAO','Bar do Alemão SP'],['ALEMÃO','Bar do Alemão SP'],['TT BURGER','TT Burger'],['CAMARADA','Camarada Camarão'],['VASTO','Vasto'],['NANICA','Nanica'],['GREENJOY','Greenjoy'],['SEVERO','Severo Burger'],['PANTANAL','Pantanal'],['OGGI','Oggi Sorvetes'],['DOG KING','Dog King'],['HORA DO PASTEL','Hora do Pastel'],['PROFOOD','ProFood'],['IPT','IPT'],['BATATA INGLESA','Batata Inglesa'],['AGUA DOCE','Água Doce'],['ÁGUA DOCE','Água Doce'],['GREEN JOY','Greenjoy']];

  const state = { tab: 'acoes', f: { sit: 'todos', os: 'todos', cli: 'todos' }, q: '', docs: { jit: null, gen: null }, osInfo: null, sel: null, canEdit: false, db: null, anim: true };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => (Math.round(n) || 0).toLocaleString('pt-BR');
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const cliente = (nome) => { const u = ' ' + String(nome).toUpperCase() + ' '; for (const [k, v] of CLI) { if (new RegExp('[^A-ZÀ-Ú]' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^A-ZÀ-Ú]').test(u)) return v; } return ''; };
  const dd = (d) => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
  const dataLonga = (iso) => { const d = new Date(iso); return dd(d) + '/' + d.getFullYear() + ' às ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  function computa(it, i, baseIso) {
    const [cod, nome, cli, media, cx, estoque, emp, os, etapa, prev, obs, sem, entrega] = it;
    const disp = estoque - emp;
    const temEnt = typeof entrega === 'number';
    const porDia = media / 30;
    const semGiro = !!sem || !(porDia > 0);
    const cob = semGiro ? 1e9 : disp / porDia;
    const st = semGiro ? 'sem' : disp < 0 ? 'falta' : cob < 20 ? 'critico' : cob < 40 ? 'atencao' : 'ok';
    let rupt = '—', ruptDias = null;
    if (!semGiro) {
      const base = baseIso ? new Date(baseIso) : new Date();
      base.setHours(0, 0, 0, 0);
      const d = new Date(base); d.setDate(d.getDate() + Math.round(cob));
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      ruptDias = disp <= 0 ? Math.min(0, Math.round((d - hoje) / 864e5)) : Math.round((d - hoje) / 864e5);
      rupt = ruptDias <= 0 ? 'Já em ruptura' : dd(d) + ', em ' + ruptDias + (ruptDias === 1 ? ' dia' : ' dias');
    }
    const cobEnt = semGiro ? null : (disp + (temEnt ? entrega : 0)) / porDia;
    const osCx = os && typeof it[15] === 'number' ? it[15] : null;
    const cobOS = semGiro || osCx === null ? null : (disp + osCx) / porDia;
    return { osCx, cobOS, i, cod, nome, cli: cli || 'Genérico', media, cx, estoque, emp, disp, os, etapa, prev, obs, sem, semGiro, cob, st, rupt, ruptDias, dias: semGiro ? (sem || 'Sem giro') : fmt(cob),
      entregaTxt: temEnt ? fmt(entrega) : '', diasEnt: cobEnt === null ? '' : fmt(cobEnt), cobEnt };
  }

  function lista(tab) {
    const doc = state.docs[tab];
    if (!doc || !Array.isArray(doc.itens)) return [];
    return doc.itens.map((it, i) => computa(it, i, doc.atualizadoEm)).sort((a, b) => a.cob - b.cob);
  }

  // ---------- filtros da lateral ----------
  const FSIT = [['todos', 'Todas', 'var(--azul)'], ['falta', 'Em falta', 'var(--falta)'], ['critico', 'Crítico (< 20 dias)', 'var(--critico)'], ['atencao', 'Atenção (20 a 39)', 'var(--atencao)'], ['ok', 'Em dia (40+)', 'var(--ok)'], ['sem', 'Sem giro', 'var(--sem)']];
  const FOS = [['todos', 'Todos'], ['com', 'Com O.S'], ['sem', 'Sem O.S']];
  const passaFiltro = (r) => (state.f.sit === 'todos' || r.st === state.f.sit)
    && (state.f.os === 'todos' || (state.f.os === 'com' ? !!r.os : !r.os))
    && (state.f.cli === 'todos' || r.cli === state.f.cli);
  const temFiltro = () => state.f.sit !== 'todos' || state.f.os !== 'todos' || state.f.cli !== 'todos' || !!String(state.q || '').trim();
  // Produtos das abas que a página usa (JIT, Genéricos ou as duas), já calculados.
  function itensPagina() {
    const out = [];
    for (const t of abasAtivas()) { const doc = state.docs[t]; if (!doc) continue; doc.itens.forEach((it, i) => out.push(Object.assign(computa(it, i, doc.atualizadoEm), { tab: t }))); }
    return out;
  }
  function renderFiltros() {
    const base = itensPagina().filter((r) => { const q = norm(state.q); return !q || norm(r.nome).includes(q) || norm(r.cod).includes(q) || norm(r.cli).includes(q); });
    const conta = (fn) => base.filter(fn).length;
    const btn = (grupo, v, rot, cor, n) => '<button class="fbtn" type="button" data-g="' + grupo + '" data-v="' + esc(v) + '" aria-pressed="' + (state.f[grupo] === v) + '">' + (cor ? '<i style="background:' + cor + '"></i>' : '') + '<span>' + esc(rot) + '</span>' + (n !== undefined ? '<b>' + n + '</b>' : '') + '</button>';
    $('f-sit').innerHTML = '<h3>Situação</h3>' + FSIT.map(([v, rot, cor]) => btn('sit', v, rot, cor, v === 'todos' ? base.length : conta((r) => r.st === v))).join('');
    $('f-os').innerHTML = '<h3>Ordem de serviço</h3>' + FOS.map(([v, rot]) => btn('os', v, rot, v === 'com' ? 'var(--azul)' : v === 'sem' ? 'var(--laranja)' : '', v === 'todos' ? base.length : conta((r) => v === 'com' ? !!r.os : !r.os))).join('');
    const clis = {}; base.forEach((r) => { clis[r.cli] = (clis[r.cli] || 0) + 1; });
    if (state.f.cli !== 'todos' && !clis[state.f.cli]) clis[state.f.cli] = 0;
    const nomes = Object.keys(clis).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    $('f-cli').innerHTML = '<h3>Franquia / cliente</h3><div class="flista">' + btn('cli', 'todos', 'Todas', '', base.length) + nomes.map((c) => btn('cli', c, c, corCli(c), clis[c])).join('') + '</div>';
    $('limpar').hidden = !temFiltro();
  }
  const PALETA = ['#4f8ef7', '#7c5cbf', '#2ec4a9', '#f5a623', '#e05c5c', '#5bc0eb', '#c77dff', '#9bc53d', '#ff8c61', '#e9c46a'];
  function corCli(c) { let h = 0; for (const ch of String(c)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETA[h % PALETA.length]; }
  document.querySelector('.lateral').addEventListener('click', (e) => {
    const b = e.target.closest('.fbtn'); if (!b) return;
    state.f[b.dataset.g] = b.dataset.v; rerender(false);
  });
  $('limpar').addEventListener('click', () => { state.f = { sit: 'todos', os: 'todos', cli: 'todos' }; state.q = ''; $('q').value = ''; rerender(false); });

  // ---------- componentes do painel ----------
  const pctN = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
  const kpi = (rot, valor, sub, cor, pct) => '<div class="kpi" style="--k:' + cor + '"><span>' + rot + '</span><b>' + valor + '</b><small>' + sub + '</small><div class="barra"><i data-w="' + Math.max(0, Math.min(100, pct || 0)) + '"></i></div></div>';
  const card = (titulo, selo, corpo, cls) => '<div class="card' + (cls ? ' ' + cls : '') + '"><div class="card-cab"><h3>' + titulo + '</h3>' + (selo ? '<span class="selo">' + selo + '</span>' : '') + '</div>' + corpo + '</div>';
  const legenda = (itens) => '<div class="legenda">' + itens.map(([rot, cor]) => '<span><i style="background:' + cor + '"></i>' + esc(rot) + '</span>').join('') + '</div>';
  const pilula = (r) => r.semGiro ? '<span class="pilula p-ne">Sem giro</span>' : r.st === 'falta' ? '<span class="pilula p-cr">Em falta</span>' : r.st === 'critico' ? '<span class="pilula p-cr">Crítico</span>' : r.st === 'atencao' ? '<span class="pilula p-at">Atenção</span>' : '<span class="pilula p-ok">Em dia</span>';
  const iniciais = (s) => String(s).replace(/[^A-Za-zÀ-ú0-9 ]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
  function animarBarras(raiz) { requestAnimationFrame(() => raiz.querySelectorAll('[data-w]').forEach((el) => { el.style.width = el.dataset.w + '%'; })); }
  const COR = { falta: '#e05c5c', critico: '#f5a623', atencao: '#e9c46a', ok: '#2ec4a9', sem: '#8b92c4' };
  const graficos = {};
  function grafico(id, cfg) {
    if (graficos[id]) { graficos[id].destroy(); delete graficos[id]; }
    const el = $(id); if (!el || !window.Chart) return;
    graficos[id] = new Chart(el, cfg);
  }
  function eixos(extra) {
    const g = { color: 'rgba(139,146,196,0.12)' }, t = { color: '#8b92c4', font: { size: 11 } };
    return Object.assign({ x: { grid: g, ticks: t, border: { display: false } }, y: { beginAtZero: true, grid: g, ticks: t, border: { display: false } } }, extra || {});
  }
  const OPC = (extra) => Object.assign({ locale: 'pt-BR', responsive: true, maintainAspectRatio: false, datasets: { bar: { maxBarThickness: 34 } }, animation: { duration: state.anim ? 700 : 0 }, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#242740', borderColor: '#3a3f6b', borderWidth: 1, titleColor: '#e8eaf6', bodyColor: '#e8eaf6', padding: 10 } } }, extra || {});
  if (window.Chart) { Chart.defaults.font.family = "'Segoe UI', Arial, sans-serif"; Chart.defaults.color = '#8b92c4'; }

  // ---------- Visão geral ----------
  function renderVisao() {
    const pg = $('pg-visao');
    const base = itensPagina().filter(casaBusca);
    if (!state.docs.jit && !state.docs.gen) { pg.innerHTML = '<div class="card"><p class="vazio">Importe a planilha de estoque para ver o painel.</p></div>'; return; }
    const giro = base.filter((r) => !r.semGiro);
    const n = (st) => giro.filter((r) => r.st === st).length;
    const A = calcAcoes();
    const comOS = giro.filter((r) => r.os).length;
    const valor = giro.length || 1;
    pg.innerHTML = '<div class="pagecab"><h2>Visão geral do estoque</h2><p class="meta">' + base.length + ' produtos' + (temFiltro() ? ' com os filtros aplicados' : '') + ' · JIT e genéricos</p></div>'
      + '<div class="kpis">'
      + kpi('Itens monitorados', fmt(base.length), giro.length + ' com consumo', 'var(--azul)', 100)
      + kpi('Em ruptura', fmt(n('falta')), pctN(n('falta'), valor) + '% dos itens com giro', 'var(--falta)', pctN(n('falta'), valor))
      + kpi('Críticos (< 20 dias)', fmt(n('critico')), pctN(n('critico'), valor) + '% dos itens com giro', 'var(--critico)', pctN(n('critico'), valor))
      + kpi('Precisam abrir O.S', fmt(A.abrir.length), 'acabam antes de ' + (A.cfg.usarLead ? 'LeadTime' : A.cfg.prazo + ' dias') + ' + ' + A.cfg.margem, 'var(--laranja)', pctN(A.abrir.length, valor))
      + kpi('Com O.S aberta', fmt(comOS), A.atrasadas.length + ' com previsão vencida', 'var(--verde)', pctN(comOS, valor))
      + '</div>'
      + '<div class="grid g21">'
      + card('Rupturas previstas nas próximas 8 semanas', 'itens', '<div class="chart"><canvas id="ch-sem"></canvas></div>' + legenda([['Sem O.S', COR.falta], ['Com O.S', '#4f8ef7']]))
      + card('Itens por situação', 'itens', '<div class="chart"><canvas id="ch-sit"></canvas></div>' + legenda([['Em falta', COR.falta], ['Crítico', COR.critico], ['Atenção', COR.atencao], ['Em dia', COR.ok], ['Sem giro', COR.sem]]))
      + '</div>'
      + '<div class="grid g2">'
      + card('Situação por franquia', 'itens', '<div class="chart alto"><canvas id="ch-cli"></canvas></div>' + legenda([['Em falta', COR.falta], ['Crítico', COR.critico], ['Atenção', COR.atencao], ['Em dia', COR.ok]]))
      + card('Disponível × consumo mensal por franquia', 'caixas', '<div class="chart alto"><canvas id="ch-cons"></canvas></div>' + legenda([['Disponível', '#4f8ef7'], ['Consumo mensal', '#7c5cbf']]))
      + '</div>'
      + '<div class="grid g3">'
      + card('Itens em dia por franquia', '%', '<div class="prog" id="v-prog"></div>')
      + card('Franquias com mais itens críticos', 'itens', '<div class="lista" id="v-lista"></div>')
      + card('Mais urgentes', 'dias', '<div id="v-top"></div>')
      + '</div>';

    // rupturas por semana
    const semanas = Array.from({ length: 8 }, (_, k) => k);
    const sOS = semanas.map(() => 0), sSem = semanas.map(() => 0);
    giro.forEach((r) => { if (r.ruptDias === null) return; const k = r.ruptDias <= 0 ? 0 : Math.floor(r.ruptDias / 7); if (k > 7) return; (r.os ? sOS : sSem)[k]++; });
    const rotSem = semanas.map((k) => k === 0 ? 'Esta sem.' : '+' + k + ' sem.');
    grafico('ch-sem', { type: 'bar', data: { labels: rotSem, datasets: [{ label: 'Sem O.S', data: sSem, backgroundColor: COR.falta, borderRadius: 4, stack: 's' }, { label: 'Com O.S', data: sOS, backgroundColor: '#4f8ef7', borderRadius: 4, stack: 's' }] }, options: OPC({ scales: eixos({ x: { stacked: true, grid: { display: false }, ticks: { color: '#8b92c4' } }, y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(139,146,196,0.12)' }, ticks: { color: '#8b92c4', precision: 0 } } }) }) });
    // rosca por situação
    const sits = ['falta', 'critico', 'atencao', 'ok', 'sem'];
    grafico('ch-sit', { type: 'doughnut', data: { labels: sits.map((s) => ST[s].label), datasets: [{ data: sits.map((s) => base.filter((r) => r.st === s).length), backgroundColor: sits.map((s) => COR[s]), borderColor: '#2d3154', borderWidth: 2 }] }, options: OPC({ cutout: '62%' }) });
    // por franquia
    const porCli = {};
    giro.forEach((r) => { const c = porCli[r.cli] || (porCli[r.cli] = { falta: 0, critico: 0, atencao: 0, ok: 0, disp: 0, cons: 0, n: 0 }); c[r.st]++; c.disp += Math.max(0, r.disp); c.cons += r.media; c.n++; });
    const clis = Object.keys(porCli).sort((a, b) => (porCli[b].falta + porCli[b].critico) - (porCli[a].falta + porCli[a].critico) || porCli[b].n - porCli[a].n).slice(0, 12);
    grafico('ch-cli', { type: 'bar', data: { labels: clis, datasets: ['falta', 'critico', 'atencao', 'ok'].map((s) => ({ label: ST[s].label, data: clis.map((c) => porCli[c][s]), backgroundColor: COR[s], borderRadius: 3, stack: 'c' })) }, options: OPC({ indexAxis: 'y', scales: { x: { stacked: true, beginAtZero: true, grid: { color: 'rgba(139,146,196,0.12)' }, ticks: { color: '#8b92c4', precision: 0 } }, y: { stacked: true, grid: { display: false }, ticks: { color: '#8b92c4', font: { size: 11 } } } } }) });

  // ---------- O.S em aberto ----------

      o.itens.push(r); mapa.set(r.os, o);

    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);

  function render() {

  ['pg-visao', 'pg-os'].forEach((id) => $(id).addEventListener('click', (e) => { const b = e.target.closest('.desc'); if (b) abrirProduto(Number(b.dataset.i), b.dataset.t); }));
  let qt; $('q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; rerender(false); }, 120); });
  $('tbody').addEventListener('click', (e) => {
    const ed = e.target.closest('.edt'); if (ed) { editarCelula(ed); return; }
    const b = e.target.closest('.desc'); if (b) abrirProduto(Number(b.dataset.i), state.tab);
  });
  // Edição direta de OS, última movimentação e previsão na tabela.
  function normPrev(v) {
    const t = v.trim(); if (!t) return '';
    let m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-]\d{2,4})?$/) || t.match(/^(\d{2})(\d{2})$/);
    if (m) { const d = +m[1], mm = +m[2]; if (d >= 1 && d <= 31 && mm >= 1 && mm <= 12) return String(d).padStart(2, '0') + '/' + String(mm).padStart(2, '0'); }
    return t;
  }
  function editarCelula(btn) {
    const i = Number(btn.dataset.i), f = Number(btn.dataset.f), tab = btn.dataset.t || state.tab;
    const doc = state.docs[tab]; if (!doc || !doc.itens[i]) return;
    const antigo = String(doc.itens[i][f] || '');
    const inp = document.createElement('input');
    inp.className = 'edt-in'; inp.value = antigo; inp.setAttribute('aria-label', btn.getAttribute('aria-label'));
    if (f === 9) inp.placeholder = 'dd/mm'; if (f === 7) { inp.placeholder = 'Nº da OS'; inp.inputMode = 'numeric'; } if (f === 8) inp.placeholder = 'Ex.: Impressão';
    btn.replaceWith(inp); inp.focus(); inp.select();
    let feito = false;
    const voltar = () => { if (inp.isConnected) inp.replaceWith(btn); };
    const salvar = async () => {
      if (feito) return; feito = true;
      let novo = inp.value.trim();
      if (f === 9) novo = normPrev(novo);
      if (f === 8 && novo) novo = novo[0].toUpperCase() + novo.slice(1);
      if (novo === antigo) { voltar(); return; }
      inp.classList.add('salvando'); inp.disabled = true;
      const atual = state.docs[tab]; const itens = atual.itens.map((x) => x.slice());
      if (!itens[i] || itens[i][0] !== doc.itens[i][0]) { toast('A lista mudou enquanto você editava. Tente de novo.', true); rerender(false); return; }
      itens[i][f] = novo;
      state.quieto = true;
      try { await state.db.doc('estoque/' + tab).update({ itens }); toast(({ 7: 'OS', 8: 'Movimentação', 9: 'Previsão' })[f] + ' do ' + itens[i][0] + ' atualizada.'); }
      catch (err) { toast('Não deu para salvar. Confira a conexão e tente de novo.', true); rerender(false); }
      finally { state.quieto = false; }
    };
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); salvar(); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); feito = true; voltar(); btn.focus(); }
    });
    inp.addEventListener('blur', () => salvar());
  }

  let toastT;
  function toast(msg, bad) {
    clearTimeout(toastT);

    el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg;
    toastT = setTimeout(() => el.remove(), 4200);

  const layer = $('layer');

  // ---------- detalhe ----------
  function abrirProduto(i, tabArg) {

  const obsResumida = (obs) => String(obs || '').split(/\r?\n/).map((l) => l.trim().replace(/^-\s*/, '')).filter(Boolean).join(' / ').replace(/\s+/g, ' ');

  // ---------- relatório "Itens até 45 dias" ----------
  const REL_PADRAO = { prioridades: '', excluirClientes: ['Bar do Alemão SP'], semPrevisao: true };
  // Data de entrega: 'sem' tira os itens com previsão (as prioridades ficam), 'com' deixa só os que têm previsão, 'todos' não filtra.
  const modoPrev = (cfg) => cfg.prevModo || (cfg.semPrevisao === false ? 'todos' : 'sem');
  function relConfig() { return Object.assign({}, REL_PADRAO, state.relCfg || {}); }
  // A busca da tela vale para os relatórios: com algo digitado, só entram os itens que casam com ela.
  // Busca + filtros da lateral valem para tabelas, gráficos e relatórios.
  const buscaTxt = () => { const p = []; const b = String(state.q || '').trim(); if (b) p.push(b); if (state.f.cli !== 'todos') p.push(state.f.cli); if (state.f.sit !== 'todos') p.push(ST[state.f.sit].label); if (state.f.os !== 'todos') p.push(state.f.os === 'com' ? 'Com O.S' : 'Sem O.S'); return p.join(' · '); };
  const casaBusca = (r) => { const q = norm(state.q); return (!q || norm(r.nome).includes(q) || norm(r.cod).includes(q) || norm(r.cli).includes(q)) && passaFiltro(r); };
  const arqBusca = () => { const b = buscaTxt(); return b ? ' - ' + b.replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 40).trim() : ''; };
  const avisoBusca = () => buscaTxt() ? '<p class="warn">Só entram os itens filtrados: ' + esc(buscaTxt()) + '. Para tirar de todos os itens, clique em Limpar filtros na lateral.</p>' : '';
  function relItens(cfg) {
    const prio = new Set(String(cfg.prioridades || '').split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean));
    const fora = new Set(cfg.excluirClientes || []);
    const out = []; let base = null; let tirPrio = 0; let tirPrev = 0;
    for (const t of abasAtivas()) {
      const doc = state.docs[t]; if (!doc) continue;
      if (doc.atualizadoEm && (!base || doc.atualizadoEm > base)) base = doc.atualizadoEm;
      doc.itens.forEach((it, i) => {
        const r = computa(it, i, doc.atualizadoEm);
        if (r.semGiro || !r.os) return;
        const dias = Math.round(r.cob);
        if (dias > 45) return;
        if (fora.has(r.cli)) return;
        if (!casaBusca(r)) return;
        // Prioridades O.S entram sempre (mesmo com data de entrega) e saem destacadas em vermelho.
        const ehPrio = prio.has(String(r.cod));
        const temPrev = !!String(r.prev || '').trim(); const mp = modoPrev(cfg);
        if (mp === 'sem' && !ehPrio && temPrev) { tirPrev++; return; }

        if (ehPrio) tirPrio++;
        out.push(Object.assign({}, r, { diasN: dias, prio: ehPrio }));
      });
    }
    out.sort((a, b) => a.cob - b.cob);

  const isoDia = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

  function compararFotos(dA, dB) {
    const mapa = (doc) => { const m = new Map(); (doc.itens || []).forEach((it, i) => { if (it[0] && !m.has(it[0])) m.set(it[0], computa(it, i, doc.atualizadoEm)); }); return m; };
    const A = mapa(dA), B = mapa(dB);
    const linhas = [];
    B.forEach((b, cod) => {
      const a = A.get(cod); if (!a) return;
      if (!casaBusca(b)) return;
      if (a.semGiro && b.semGiro) return;
      const da = diasCap(a), db = diasCap(b);
      linhas.push({ cod, nome: b.nome, cli: b.cli, os: b.os, a, b, estA: a.estoque, estB: b.estoque, dispA: a.disp, dispB: b.disp,
        diasA: da, diasB: db, dDias: (db ?? 0) - (da ?? 0), varEst: pct(a.estoque, b.estoque) });
    });
    const validos = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro);
    const conta = (lado) => { const c = { falta: 0, critico: 0, atencao: 0, ok: 0 }; validos.forEach((l) => { const r = l[lado]; const st = !r.semGiro && r.disp <= 0 ? 'falta' : r.st; if (c[st] !== undefined) c[st]++; }); return c; };
    const sit = { a: conta('a'), b: conta('b') };
    const ruptA = sit.a.falta, ruptB = sit.b.falta;
    const sairam = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro && l.dispA <= 0 && l.dispB > 0).sort((x, y) => y.dispB - x.dispB);
    const entraram = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro && l.dispA > 0 && l.dispB <= 0).sort((x, y) => x.dispB - y.dispB);
    const melhoraram = validos.filter((l) => l.dDias > 0 && l.dispB > l.dispA).sort((x, y) => y.dDias - x.dDias);
    const pioraram = validos.filter((l) => l.dDias < 0 && l.dispB < l.dispA).sort((x, y) => x.dDias - y.dDias);
    const somaA = linhas.reduce((s, l) => s + l.estA, 0), somaB = linhas.reduce((s, l) => s + l.estB, 0);

  function grafSituacao(pdf, x, y, w, h, sit, rotA, rotB, cores) {
    const max = Math.max(1, ...SIT.map(([k]) => Math.max(sit.a[k], sit.b[k])));

    for (let i = 0; i <= 4; i++) { const v = topo * i / 4, yy = baseY - alt * i / 4; pdf.line(x, yy, x + w, yy); pdf.text(String(Math.round(v)), x - 1.5, yy + 1, { align: 'right' }); }
    SIT.forEach(([k, lab], i) => {
      const cx = x + grupo * i + grupo / 2;
      [[sit.a[k], [190, 190, 190]], [sit.b[k], cores[k]]].forEach(([v, cor], j) => {

  function grafMelhoras(pdf, x, y, w, lista, cor) {

    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5); pdf.setTextColor(...VERM);
    pdf.text('PROFOOD EMBALAGENS · PCP', M, 16);
    pdf.setFontSize(19); pdf.setTextColor(...TINTA);
    pdf.text('Relatório semanal de estoque', M, 24);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(...CINZA);
    pdf.text('O que mudou nos ' + nomeAba + ' entre ' + diaBR(fotoA) + ' e ' + diaBR(fotoB) + (buscaTxt() ? '. Filtro: ' + buscaTxt() : ''), M, 29.5);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10.5); pdf.setTextColor(...TINTA);
    pdf.text(diaBR(fotoA) + ' a ' + diaBR(fotoB), W - M, 23, { align: 'right' });
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...CINZA);
    pdf.text('emitido em ' + dataBR(new Date()), W - M, 27.5, { align: 'right' });
    const vEst = pct(cmp.somaA, cmp.somaB);
    const cards = [
      ['EM RUPTURA', cmp.ruptA + ' » ' + cmp.ruptB, cmp.ruptB <= cmp.ruptA ? VERDE : VERM, (cmp.ruptB - cmp.ruptA > 0 ? '+' : '') + (cmp.ruptB - cmp.ruptA) + ' itens'],
      ['SAÍRAM DA RUPTURA', String(cmp.sairam.length), VERDE, cmp.entraram.length + ' entraram'],
      ['MELHORARAM', String(cmp.melhoraram.length), VERDE, cmp.pioraram.length + ' pioraram'],
      ['ESTOQUE TOTAL (CX)', fmt(cmp.somaB), vEst !== null && vEst < 0 ? VERM : VERDE, pctTxt(vEst) + ' vs ' + fmt(cmp.somaA)]
    ];
    const gap = 3.5, cw = (W - 2 * M - 3 * gap) / 4, cy = 35, ch = 21;
    cards.forEach(([lab, val, cor, sub], k) => {
      const x = M + k * (cw + gap);
      pdf.setDrawColor(222, 222, 222); pdf.setLineWidth(0.25); pdf.roundedRect(x, cy, cw, ch, 1.2, 1.2, 'S');
      pdf.setFillColor(...cor); pdf.rect(x, cy, 1.1, ch, 'F');
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...CINZA); pdf.text(lab, x + 4, cy + 5.5);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16); pdf.setTextColor(...cor); pdf.text(val, x + 4, cy + 13.5);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(...CINZA); pdf.text(sub, x + 4, cy + 18.3);
    });
    let y = cy + ch + 9;
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...TINTA); pdf.text('Produtos por situação', M, y);
    grafSituacao(pdf, M + 8, y + 3, W - 2 * M - 8, 58, cmp.sit, diaBR(fotoA), diaBR(fotoB), cores);
    y += 68;
    if (cmp.melhoraram.length) {
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...TINTA); pdf.text('Maiores ganhos em dias de estoque', M, y);
      y = grafMelhoras(pdf, M, y + 4, W - 2 * M, cmp.melhoraram, VERDE) + 6;
    }
    const tabela = (titulo, nota, linhas, cols, corCol) => {
      if (y > 250) { pdf.addPage(); y = 20; }
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...TINTA); pdf.text(titulo, M, y);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(...CINZA); pdf.text(nota, M, y + 4);
      if (!linhas.length) { pdf.setFontSize(8); pdf.text('Nenhum produto nesta situação no período.', M, y + 10); y += 18; return; }
      pdf.autoTable({
        startY: y + 6, margin: { left: M, right: M, top: 16, bottom: 16 },
        head: [cols.map((c) => c[0])], body: linhas.map((l) => cols.map((c) => c[1](l))),
        theme: 'plain',
        styles: { font: 'helvetica', fontSize: 7.4, textColor: TINTA, cellPadding: { top: 1.9, bottom: 1.9, left: 1.5, right: 1.5 }, lineColor: [228, 228, 228], valign: 'middle' },
        headStyles: { fontStyle: 'bold', fontSize: 6.3, textColor: CINZA, valign: 'bottom', lineWidth: { bottom: 0.4 }, lineColor: [60, 60, 60] },
        bodyStyles: { lineWidth: { bottom: 0.15 } },
        columnStyles: Object.fromEntries(cols.map((c, i) => [i, i === 0 ? { cellWidth: 'auto' } : { halign: 'right', cellWidth: c[2] || 18 }])),
        didParseCell: (d) => { if (d.section === 'head' && d.column.index > 0) d.cell.styles.halign = 'right'; if (d.section === 'body' && corCol && corCol[d.column.index]) { d.cell.styles.textColor = corCol[d.column.index](linhas[d.row.index]); d.cell.styles.fontStyle = 'bold'; } },
        showHead: 'everyPage'
      });
      y = pdf.lastAutoTable.finalY + 9;
    };
    const item = ['ITEM', (l) => l.cod + ' ' + l.nome];
    const dCor = (v) => v === null ? CINZA : v <= 0 ? VERM : v < 30 ? LAR : v <= 45 ? OURO : VERDE;
    const dTxt = (v) => v === null ? 'Sem giro' : String(v);
    tabela('Saíram da ruptura', 'Tinham disponível zerado ou negativo em ' + diaBR(fotoA) + ' e agora têm saldo.', cmp.sairam,
      [item, ['DISP.\nANTES', (l) => fmt(l.dispA)], ['DISP.\nAGORA', (l) => fmt(l.dispB)], ['DIAS\nAGORA', (l) => dTxt(l.diasB)], ['O.S', (l) => l.os || '—']],
      { 2: () => VERDE, 3: (l) => dCor(l.diasB) });
    tabela('Produtos que mais melhoraram', 'Maior ganho em dias de estoque. Variação do estoque em caixas entre as duas datas.', cmp.melhoraram.slice(0, 20),
      [item, ['ESTOQUE\nANTES', (l) => fmt(l.estA)], ['ESTOQUE\nAGORA', (l) => fmt(l.estB)], ['VARIAÇÃO', (l) => pctTxt(l.varEst)], ['DIAS\nANTES', (l) => dTxt(l.diasA)], ['DIAS\nAGORA', (l) => dTxt(l.diasB)]],
      { 3: (l) => l.varEst > 0 ? VERDE : CINZA, 5: (l) => dCor(l.diasB) });
    tabela('Entraram em ruptura', 'Tinham saldo em ' + diaBR(fotoA) + ' e agora estão com disponível zerado ou negativo.', cmp.entraram,
      [item, ['DISP.\nANTES', (l) => fmt(l.dispA)], ['DISP.\nAGORA', (l) => fmt(l.dispB)], ['O.S', (l) => l.os || '—']],
      { 2: () => VERM });
    tabela('Produtos que mais pioraram', 'Maior perda em dias de estoque.', cmp.pioraram.slice(0, 15),
      [item, ['ESTOQUE\nANTES', (l) => fmt(l.estA)], ['ESTOQUE\nAGORA', (l) => fmt(l.estB)], ['VARIAÇÃO', (l) => pctTxt(l.varEst)], ['DIAS\nANTES', (l) => dTxt(l.diasA)], ['DIAS\nAGORA', (l) => dTxt(l.diasB)]],
      { 3: (l) => l.varEst < 0 ? VERM : CINZA, 5: (l) => dCor(l.diasB) });
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(...CINZA);
    const nota = pdf.splitTextToSize('Compara as fotos do estoque salvas pelo site em ' + diaBR(fotoA) + ' e ' + diaBR(fotoB) + ', só com produtos que estão nas duas. Dias de estoque = disponível (estoque − empenhado) ÷ média mensal × 30. Itens "Sem giro" / "Sem média" em alguma das datas ficam fora das contagens e comparações (' + cmp.foraGiro + ' produtos neste período).', W - 2 * M);
    if (y + nota.length * 3.5 > 297 - 16) { pdf.addPage(); y = 20; }
    pdf.text(nota, M, y);
    const total = pdf.getNumberOfPages();
    for (let p = 1; p <= total; p++) { pdf.setPage(p); pdf.setFontSize(7); pdf.setTextColor(...CINZA); pdf.text('Página ' + p + ' de ' + total, W - M, 297 - 8, { align: 'right' }); }
    return pdf.output('blob');
  }

  function gerarSemanalXLSX(cmp, fotoA, fotoB, nomeAba) {
    const wb = XLSX.utils.book_new();
    const A = diaBR(fotoA), B = diaBR(fotoB);
    const add = (nome, linhas) => { const ws = XLSX.utils.aoa_to_sheet(linhas); ws['!cols'] = linhas[0].map((_, i) => ({ wch: i === 1 ? 58 : 14 })); XLSX.utils.book_append_sheet(wb, ws, nome); };
    const dv = (v) => v === null ? 'Sem giro' : v;
    add('Resumo', [['Relatório semanal de estoque', ''], ['Produtos', nomeAba], ['Período', A + ' a ' + B], ['Filtro', buscaTxt() || 'Todos os itens'], [], ['Indicador', A, B],
      ...SIT.map(([k, l]) => [l, cmp.sit.a[k], cmp.sit.b[k]]), ['Estoque total (caixas)', cmp.somaA, cmp.somaB], [],
      ['Saíram da ruptura', cmp.sairam.length], ['Entraram em ruptura', cmp.entraram.length], ['Melhoraram', cmp.melhoraram.length], ['Pioraram', cmp.pioraram.length]]);
    const cab = ['Código', 'Descrição', 'Cliente', 'Estoque ' + A, 'Estoque ' + B, 'Variação estoque', 'Disponível ' + A, 'Disponível ' + B, 'Dias ' + A, 'Dias ' + B, 'Ganho em dias', 'OS'];
    const lin = (l) => [l.cod, l.nome, l.cli, l.estA, l.estB, l.varEst === null ? '' : l.varEst / 100, l.dispA, l.dispB, dv(l.diasA), dv(l.diasB), l.dDias, l.os || ''];
    add('Melhoraram', [cab, ...cmp.melhoraram.map(lin)]);
    add('Saíram da ruptura', [cab, ...cmp.sairam.map(lin)]);
    add('Pioraram', [cab, ...cmp.pioraram.map(lin)]);
    add('Entraram em ruptura', [cab, ...cmp.entraram.map(lin)]);
    add('Comparativo completo', [cab, ...cmp.linhas.slice().sort((x, y) => (x.b.cob) - (y.b.cob)).map(lin)]);
    ['Melhoraram', 'Saíram da ruptura', 'Pioraram', 'Entraram em ruptura', 'Comparativo completo'].forEach((n) => {
      const ws = wb.Sheets[n]; const r = XLSX.utils.decode_range(ws['!ref']);
      for (let i = 1; i <= r.e.r; i++) { const c = ws[XLSX.utils.encode_cell({ r: i, c: 5 })]; if (c && c.t === 'n') c.z = '0%'; }
    });
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function baixar(blob, nome) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

  $('semanal').addEventListener('click', async () => {
    const aba = state.tab === 'gen' ? 'gen' : 'jit'; const nomeAba = aba === 'jit' ? 'produtos JIT' : 'genéricos';
    const { data: dias, error } = await sb.from('estoque_pcp_historico').select('dia').eq('tab', aba).order('dia', { ascending: false });
    if (error) { toast('Não deu para ler o histórico. Confira a conexão e tente de novo.', true); return; }
    const lista = (dias || []).map((d) => d.dia);
    if (lista.length < 2) {
      dialogo('<h2 id="dlg-t">Relatório semanal</h2><p class="meta">O relatório compara duas fotos do estoque dos ' + nomeAba + '. ' + (lista.length ? 'Por enquanto só existe a de ' + diaBR(lista[0]) + '.' : 'Ainda não há nenhuma foto salva.') + ' O site guarda uma foto a cada importação da planilha de estoque; depois da próxima importação o relatório já fica disponível.</p><div class="row-end"><button class="btn solid" type="button" data-cancel>Entendi</button></div>');
      return;
    }
    const fim = lista[0];
    const alvo = new Date(isoDia(fim)); alvo.setDate(alvo.getDate() - 7);
    const ini = lista.find((d) => isoDia(d) <= alvo) || lista[lista.length - 1];
    const opts = (sel) => lista.map((d) => '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + diaBR(d) + '</option>').join('');
    dialogo('<h2 id="dlg-t">Relatório semanal: ' + nomeAba + '</h2>'
      + avisoBusca()
      + '<p class="meta">Compara duas fotos do estoque: o que melhorou, o que piorou e quais produtos saíram ou entraram em ruptura.</p>'
      + '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><label class="field" for="sem-a">De<select id="sem-a" style="min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px">' + opts(ini) + '</select></label>'
      + '<label class="field" for="sem-b">Até<select id="sem-b" style="min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px">' + opts(fim) + '</select></label></div>'
      + '<div id="sem-prev" class="meta" aria-live="polite">Carregando…</div>'
      + '<div class="row-end"><button class="btn quiet" type="button" data-cancel>Cancelar</button><button class="btn" type="button" id="sem-xlsx" disabled>Baixar planilha Excel</button><button class="btn solid" type="button" id="sem-pdf" disabled>Baixar relatório em PDF</button></div>');
    const cache = {};
    const foto = async (d) => { if (cache[d]) return cache[d]; const { data, error: e } = await sb.from('estoque_pcp_historico').select('data').eq('tab', aba).eq('dia', d).single(); if (e) throw e; return (cache[d] = data.data); };
    let atual = null;
    const prever = async () => {
      const a = $('sem-a').value, b = $('sem-b').value;
      $('sem-pdf').disabled = $('sem-xlsx').disabled = true;
      if (a >= b) { $('sem-prev').innerHTML = '<span style="color:var(--falta)">Escolha uma data “De” anterior à data “Até”.</span>'; atual = null; return; }
      $('sem-prev').textContent = 'Carregando…';
      try {
        const [fa, fb] = await Promise.all([foto(a), foto(b)]);
        const cmp = compararFotos(fa, fb); atual = { cmp, a, b };
        $('sem-prev').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;color:var(--paper)">'
          + [['Em ruptura', cmp.ruptA + ' → ' + cmp.ruptB], ['Saíram da ruptura', cmp.sairam.length], ['Entraram em ruptura', cmp.entraram.length], ['Melhoraram', cmp.melhoraram.length], ['Pioraram', cmp.pioraram.length], ['Estoque total', pctTxt(pct(cmp.somaA, cmp.somaB))]]
            .map(([k, v]) => '<div style="padding:10px 12px;border:1px solid var(--line);border-radius:10px"><div class="meta" style="font-size:13px">' + k + '</div><b style="font-size:20px">' + v + '</b></div>').join('')
          + '</div>' + (cmp.melhoraram[0] ? '<p class="meta" style="margin-top:10px">Maior melhora: ' + esc(cmp.melhoraram[0].cod + ' ' + cmp.melhoraram[0].nome) + ' (+' + cmp.melhoraram[0].dDias + ' dias, estoque ' + pctTxt(cmp.melhoraram[0].varEst) + ').</p>' : '');
        $('sem-pdf').disabled = $('sem-xlsx').disabled = false;
      } catch (e) { $('sem-prev').innerHTML = '<span style="color:var(--falta)">Não deu para carregar as fotos. Tente de novo.</span>'; }
    };
    $('sem-a').addEventListener('change', prever); $('sem-b').addEventListener('change', prever);
    const nomeBase = () => 'Relatorio semanal ' + (aba === 'jit' ? 'JIT' : 'Genericos') + ' ' + diaBR(atual.a).replace(/\//g, '-') + ' a ' + diaBR(atual.b).replace(/\//g, '-') + arqBusca();
    $('sem-pdf').addEventListener('click', () => {
      if (!atual) return;
      if (!window.jspdf || !window.jspdf.jsPDF) { toast('O gerador de PDF não carregou. Recarregue a página e tente de novo.', true); return; }
      try { baixar(gerarSemanalPDF(atual.cmp, atual.a, atual.b, nomeAba), nomeBase() + '.pdf'); toast('Relatório semanal baixado.'); } catch (e) { toast('Não deu para gerar o PDF. Tente de novo.', true); }
    });
    $('sem-xlsx').addEventListener('click', () => {
      if (!atual) return;
      try { baixar(gerarSemanalXLSX(atual.cmp, atual.a, atual.b, nomeAba), nomeBase() + '.xlsx'); toast('Planilha do relatório semanal baixada.'); } catch (e) { toast('Não deu para gerar a planilha. Tente de novo.', true); }
    });
    prever();
  });

  // ---------- dados (Supabase) ----------
  const SUPA_URL = 'https://mnvyitxutjvsoqgfftxn.supabase.co';
  const SUPA_KEY = 'sb_publishable_Oxodo29Euz7H_cCA1fRNCQ_Iobo-dqp';
  const sb = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;
  const linhas = {};
  function aplicar(id, data) {
    linhas[id] = data;
    if (id === 'jit' || id === 'gen') state.docs[id] = data && Array.isArray(data.itens) ? data : null;
    if (id === 'os') state.osInfo = data;
    if (id === 'config') state.relCfg = data;
  }
  async function gravar(id, data) {
    const { error } = await sb.from('estoque_pcp').upsert({ id, data }, { onConflict: 'id' });
    if (error) throw error;
    aplicar(id, data);
    rerender(id === state.tab && !state.quieto);
  }
  state.db = {
    doc: (path) => {
      const id = path.split('/')[1];
      return {
        set: (data) => gravar(id, data),
        update: (parte) => gravar(id, Object.assign({}, linhas[id] || {}, parte))
      };
    }
  };
  async function carregar() {
    const { data, error } = await sb.from('estoque_pcp').select('id,data');
    if (error) { $('conn').textContent = 'Não deu para carregar os dados. Recarregue a página.'; return; }
    ['jit', 'gen', 'os', 'config'].forEach((id) => aplicar(id, null));
    (data || []).forEach((r) => aplicar(r.id, r.data));
    rerender(true);
  }
  let canal = null;
  function ouvir() {
    if (canal) return;
    canal = sb.channel('estoque_pcp').on('postgres_changes', { event: '*', schema: 'public', table: 'estoque_pcp' }, (p) => {
      if (p.new && p.new.id) { aplicar(p.new.id, p.new.data); if (!document.querySelector('.edt-in')) rerender(false); }
    }).subscribe();
  }
  function telaLogin(msg) {
    layer.innerHTML = '<div class="overlay center"><form class="dialog login" id="login" novalidate aria-labelledby="lg-t">'
      + '<span class="seal" hidden aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>'
      + '<h2 id="lg-t">Entrar no Controle Estoque PCP</h2>'
      + '<p class="meta">Use o mesmo usuário e senha dos outros painéis da ProFood.</p>'
      + (msg ? '<p class="err" role="alert">' + esc(msg) + '</p>' : '')
      + '<label class="field" for="lg-user">Usuário<input id="lg-user" autocomplete="username" placeholder="Ex.: matheuspcp" required></label>'
      + '<label class="field" for="lg-pass">Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>'
      + '<button class="btn solid" type="submit" id="lg-ok" style="justify-content:center">Entrar</button>'
      + '</form></div>';
    $('lg-user').focus();
    $('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      let u = $('lg-user').value.trim().toLowerCase(); const s = $('lg-pass').value;
      if (!u || !s) { telaLogin('Preencha o usuário e a senha.'); return; }
      if (!u.includes('@')) u += '@profood.local';
      $('lg-ok').disabled = true; $('lg-ok').textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email: u, password: s });
      if (error) { telaLogin('Usuário ou senha incorretos. Confira e tente de novo.'); return; }
    });
  }
  async function entrou(session) {
    fechar();
    const email = session.user.email || '';
    const { data: pode } = await sb.rpc('estoque_pcp_pode');
    state.canEdit = !!pode;
    $('conn').innerHTML = '<span>' + esc(email.replace('@profood.local', '')) + '</span> <button class="btn quiet" type="button" id="sair" style="min-height:36px;padding:0 12px;margin-left:8px">Sair</button>';
    $('sair').addEventListener('click', async () => { await sb.auth.signOut(); });
    if (!pode) { $('conn').insertAdjacentHTML('afterbegin', '<span style="color:var(--falta)">Este usuário não tem acesso ao estoque. </span>'); render(); return; }
    await carregar();
    ouvir();
  }

  render();
  if (!sb) { $('conn').textContent = 'O banco de dados não carregou. Confira a internet e recarregue a página.'; }
  else {
    $('conn').textContent = '';
    sb.auth.onAuthStateChange((ev, session) => {
      if (session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => entrou(session), 0);
      if (!session) { if (canal) { sb.removeChannel(canal); canal = null; } state.canEdit = false; ['jit', 'gen', 'os', 'config'].forEach((id) => aplicar(id, null)); $('conn').textContent = ''; render(); telaLogin(); }
    });
  }
})();
</script>
