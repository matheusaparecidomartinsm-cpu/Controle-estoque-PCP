<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Controle Estoque PCP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
/* Layout: tela de trabalho densa, como a planilha do PCP. Barra simples no topo, abas e ferramentas numa linha, e a tabela ocupando a tela.
   A cor fica só para a situação de cada item (faixa na borda da linha e a célula de Dias pintada, como formatação condicional). Tema escuro por escolha. */
:root{
  --bg:#0E0F11;          /* fundo grafite */
  --surface:#15171A;     /* cabeçalho da tabela, janelas */
  --surface-2:#1C1F23;   /* campos, botões */
  --raise:#1A1D21;       /* linha com o mouse em cima */
  --line:#2A2E34;        /* bordas de controles */
  --rule:#1F2226;        /* divisórias das linhas */
  --paper:#E8EAED;       /* texto */
  --kraft:#9CA1AA;       /* texto secundário */
  --dim:#5F646C;         /* vazio */
  --accent:#E8EAED;      /* ação principal: texto claro sobre o grafite */
  --accent-ink:#0E0F11;
  --focus:#7FB0FF;       /* foco do teclado e edição */
  --falta:#F25C61;
  --critico:#F0913F;
  --atencao:#E3C15B;
  --ok:#4DBB8C;
  --sem:#6D7279;
  --obs:#D9C9A3;
  --display:'Instrument Sans','Segoe UI',Roboto,Arial,sans-serif;
  --body:'Instrument Sans','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--rule)}
header .wrap{min-height:60px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brandbox{display:flex;align-items:center}
.seal{display:none}
.brand{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em;line-height:1.2;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-size:14px;font-weight:450;color:var(--kraft)}
.updated{color:var(--kraft);font-size:14px}
#conn{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--kraft)}
main.wrap{padding-block:20px 64px;display:flex;flex-direction:column;gap:14px}
.tabsrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--rule)}
.tabs{display:flex;gap:28px}
.tab{position:relative;display:flex;white-space:nowrap;align-items:baseline;gap:8px;min-height:44px;padding:8px 0 12px;border:0;background:none;color:var(--kraft);font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;cursor:pointer;transition:color .2s}
.tab span{font-size:15px;font-weight:500;color:var(--dim)}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--paper);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.tab[aria-selected="true"]{color:var(--paper)}
.tab[aria-selected="true"] span{color:var(--kraft)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab:hover{color:var(--paper)}
.meta{color:var(--kraft);font-size:14px;margin:0}
#tabmeta{display:inline-flex;align-items:center;gap:8px;padding-bottom:12px}
#tabmeta:not(:empty)::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.toolbar{display:block}
.filters{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--paper);font-family:var(--body);font-size:14px;font-weight:550;cursor:pointer;transition:background-color .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:#3A3F46}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.solid:hover{background:#FFFFFF;border-color:#FFFFFF}
.btn.quiet{background:transparent}
.btn svg{flex-shrink:0;width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.search{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:360px;max-width:100%;transition:border-color .15s}
.search:focus-within{border-color:var(--focus);outline:0}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--paper);font-family:var(--body);font-size:14px}
.search input::placeholder{color:var(--dim)}
.sheet{max-height:calc(100vh - 230px);min-height:420px;overflow:auto;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;font-stretch:92%}
th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;vertical-align:bottom;padding:9px 10px;font-size:13px;font-weight:550;line-height:1.25;color:var(--kraft);border-bottom:1px solid var(--line);white-space:normal}
th.n,td.n{text-align:right}
th.n{width:74px;min-width:64px}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}
th:first-child{z-index:3;min-width:400px;padding-left:16px}
td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle;line-height:1.35}
td:first-child{background:var(--bg);border-left:3px solid var(--st,var(--sem));padding-left:13px;max-width:460px}
td.cli{color:var(--kraft);max-width:132px;overflow:hidden;text-overflow:ellipsis}
td.obs{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--obs)}
td.dias{font-weight:700}
tr.r{transition:background-color .15s}
tr.r:hover td{background-color:var(--raise)}
tr.r:hover td.dias{filter:brightness(1.15)}
tbody tr:last-child td{border-bottom:0}
.item{display:flex;align-items:baseline;gap:10px;min-width:0}
.dot{display:none}
.cod{flex-shrink:0;width:44px;color:var(--kraft);font-size:13px}
.desc{display:block;min-width:0;max-width:330px;padding:2px 0;border:0;background:none;color:var(--paper);font-family:var(--body);font-size:14px;font-weight:500;font-stretch:92%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.desc:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--kraft)}
.pill{display:inline;padding:0;background:none!important;font-weight:700}
.muted{color:var(--dim)}
.edt{display:inline-flex;align-items:center;gap:6px;min-height:30px;max-width:150px;overflow:hidden;padding:3px 7px;margin:-3px -7px;border:1px solid transparent;border-radius:6px;background:none;color:inherit;font-family:var(--body);font-size:14px;font-stretch:92%;text-align:left;cursor:text;transition:border-color .15s,background-color .15s}
.edt:hover,.edt:focus-visible{border-color:var(--line);background:var(--surface-2)}
.edt svg{opacity:0;flex-shrink:0;color:var(--kraft);transition:opacity .15s}
.edt:hover svg,.edt:focus-visible svg{opacity:1}
.edt-in{width:140px;min-height:30px;padding:3px 7px;margin:-3px -7px;border:1px solid var(--focus);border-radius:6px;background:var(--surface);color:var(--paper);font-family:var(--body);font-size:14px}
.edt-in.salvando{opacity:.6}
/* carregamento: cada linha entra da esquerda para a direita, célula por célula, com uma linha fina correndo embaixo */
@keyframes scan{0%{background-size:0% 1px;background-position:0% 100%}50%{background-size:100% 1px;background-position:0% 100%}50.1%{background-size:100% 1px;background-position:100% 100%}100%{background-size:0% 1px;background-position:100% 100%}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.anim td{background-image:linear-gradient(var(--kraft),var(--kraft));background-repeat:no-repeat;background-size:0% 1px;background-position:0% 100%;animation:scan .2s linear forwards;animation-delay:calc(var(--r) + var(--k))}
.anim td>.v{display:inline-block;clip-path:inset(0 100% 0 0);animation:reveal .22s ease-out forwards;animation-delay:calc(var(--r) + var(--k) + .04s)}
.anim td>.v.item,.v.item{display:flex}
.empty{padding:56px 20px;text-align:center;color:var(--kraft);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty strong{font-size:20px;font-weight:650;color:var(--paper)}
/* janelas */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:.4;transform:translateX(32px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,7,8,.74);display:flex;animation:fade .2s ease both;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.overlay.center{align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.side{justify-content:flex-end}
.dialog{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 64px rgba(0,0,0,.55);animation:rise .3s cubic-bezier(.22,.61,.36,1) both}
.dialog h2,.drawer h2{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.dialog .meta,.drawer .meta{font-size:14px;line-height:1.5}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{padding:4px 10px;border-radius:6px;font-size:13px;font-weight:550;background:var(--surface-2);color:var(--kraft)}
.col.ok{color:var(--ok);background:rgba(77,187,140,.12)}
.col.miss{color:var(--falta);background:rgba(242,92,97,.12)}
.warn{margin:0;padding:10px 12px;border-radius:8px;background:rgba(227,193,91,.1);color:var(--obs);font-size:14px;line-height:1.45}
.err{margin:0;padding:10px 12px;border-radius:8px;background:rgba(242,92,97,.12);color:var(--falta);font-size:14px;line-height:1.45}
.prev{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.prev table{min-width:720px;font-size:13px}
.prev th{position:static}
.prev th:first-child,.prev td:first-child{position:static;border-left:0;min-width:0;padding-left:12px}
.row-end{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--focus);flex-shrink:0;margin-top:1px}
.drawer{width:460px;max-width:100%;height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:20px;animation:slide .3s cubic-bezier(.22,.61,.36,1) both}
.big{display:flex;align-items:baseline;gap:12px;padding:16px 18px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--sem)}
.big b{font-size:48px;font-weight:700;letter-spacing:-.02em;line-height:1}
dl{margin:0;border-radius:10px;border:1px solid var(--line);padding:2px 14px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
dl div:last-child{border-bottom:0}
dt{color:var(--kraft)}
dd{margin:0;text-align:right;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:3px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.seg button{min-height:38px;border-radius:7px;border:0;background:transparent;color:var(--kraft);font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--kraft)}
.field input,.field textarea,.field select{min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px}
.close{width:40px;height:40px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center}
.close:hover{background:var(--surface-2)}
.login{max-width:400px;align-items:stretch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;width:min(440px,calc(100% - 32px));padding:12px 16px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--surface-2);color:var(--paper);font-size:14px;font-weight:550;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:rise .3s cubic-bezier(.22,.61,.36,1) both}
.toast.bad{border-left-color:var(--falta)}
/* ações de hoje */
.acoes{display:flex;flex-direction:column;gap:28px}
.plano{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding:14px 16px;border-radius:8px;background:var(--surface)}
.plano .btn{margin-left:auto}
.plano-campo{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--kraft)}
.plano-campo span{display:flex;align-items:center;gap:8px;color:var(--paper);font-size:14px}
.plano-campo input{width:72px;min-height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px;font-variant-numeric:tabular-nums}
.acoes-bloco{display:flex;flex-direction:column;gap:10px}
.acoes-cab h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.acoes-cab h2 span{font-size:15px;font-weight:500;color:var(--kraft)}
.acoes-cab .meta{margin-top:4px;max-width:760px}
.acoes-sheet{max-height:none;min-height:0}
.acoes-sheet th:first-child{min-width:360px}
.acoes-vazio{margin:0;padding:18px 16px;border-radius:8px;background:var(--surface);color:var(--kraft);font-size:14px}
td.sug{font-weight:700;color:var(--paper)}
.tag{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:5px;background:rgba(242,92,97,.14);color:var(--falta);font-size:12px;font-weight:600}
@media (max-width:760px){
  .plano .btn{margin-left:0;width:100%;justify-content:center}
  .brand small{display:none}
  .tab{font-size:16px}.tab span{font-size:13px}.tabs{gap:16px;max-width:100%;overflow-x:auto}
  #tabmeta{padding-bottom:0;width:100%;order:3;margin-bottom:10px}
  .search{width:100%;order:-1}
  .actions{width:100%}.actions .btn{flex:1 1 calc(50% - 4px);justify-content:center;padding:0 10px}
  th:first-child{min-width:230px}.desc{max-width:180px}td:first-child{max-width:260px}
  .sheet{max-height:none;min-height:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.anim td>.v{clip-path:none}}
</style>

<header>
  <div class="wrap">
    <div class="brandbox">
      <span class="seal" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>
      <h1 class="brand">Controle Estoque PCP<small>ProFood Embalagens</small></h1>
    </div>
    <span class="updated" id="conn"></span>
  </div>
</header>

<main class="wrap">
  <div class="tabsrow">
    <div class="tabs" role="tablist" aria-label="Tipo de produto">
      <button class="tab" role="tab" id="tab-acoes" data-tab="acoes" aria-selected="false">Ações de hoje <span id="n-acoes">0</span></button>
      <button class="tab" role="tab" id="tab-jit" data-tab="jit" aria-selected="true">Produtos JIT <span id="n-jit">0</span></button>
      <button class="tab" role="tab" id="tab-gen" data-tab="gen" aria-selected="false">Genéricos <span id="n-gen">0</span></button>
    </div>
    <p class="meta" id="tabmeta"></p>
  </div>

  <section class="toolbar" aria-label="Importar e buscar">
    <div class="filters">
      <div class="actions" id="actions">
        <button class="btn solid" id="imp-estoque" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 3h14"></path></svg>
          Importar estoque
        </button>
        <button class="btn" id="imp-os" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 3h14"></path></svg>
          Importar OS
        </button>
        <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
        <button class="btn quiet" id="relatorio" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>
          Relatório 45 dias
        </button>
        <button class="btn quiet" id="semanal" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg>
          Relatório semanal
        </button>
      </div>
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--kraft)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" id="q" placeholder="Buscar código, produto ou cliente" aria-label="Buscar produto">
      </label>
    </div>
  </section>

  <div id="acoes" class="acoes" hidden></div>
  <div class="sheet" id="planilha">
    <table>
      <thead>
        <tr>
          <th>Descrição produto</th>
          <th class="n">Média mensal</th>
          <th class="n">Qtd. por caixa</th>
          <th class="n">Estoque</th>
          <th class="n">Empenhado</th>
          <th class="n">Disponível</th>
          <th class="n">Entrega pendente</th>
          <th class="n">Dias</th>
          <th class="n">Dias c/ entrega</th>
          <th>Ruptura</th>
          <th>OS</th>
          <th>Última movimentação</th>
          <th>Previsão</th>
          <th>Observação</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function () {
  const ST = {
    falta: { label: 'Em falta', cor: 'var(--falta)', bg: 'rgba(242,92,97,.17)' },
    critico: { label: 'Crítico', cor: 'var(--critico)', bg: 'rgba(240,145,63,.14)' },
    atencao: { label: 'Atenção', cor: 'var(--atencao)', bg: 'rgba(227,193,91,.11)' },
    ok: { label: 'Em dia', cor: 'var(--ok)', bg: 'transparent' },
    sem: { label: 'Sem giro', cor: 'var(--sem)', bg: 'transparent' }
  };
  const ORDER = ['falta', 'critico', 'atencao', 'ok', 'sem'];

      const diasTxt = norm(g('dias'));
      const sem = diasTxt.startsWith('semgiro') ? 'Sem giro' : (diasTxt.startsWith('semmedia') || diasTxt.includes('incalcul')) ? 'Sem média' : '';
      const os = texto(g('os')).replace(/\.0+$/, '').replace(/\.$/, '');
      const et = texto(g('etapa'));
      const ent = col.entrega === undefined ? null : num(g('entrega'));
      const lead = col.lead === undefined || texto(g('lead')) === '' ? null : num(g('lead'));
      itens.push([cod, nome, cliente(nome), num(g('media')), num(g('cx')), num(g('estoque')), num(g('emp')), os, et ? et[0].toUpperCase() + et.slice(1).toLowerCase() : '', texto(g('prev')), texto(g('obs')), sem, ent, lead]);
    }
    if (!itens.length) throw new Error('A planilha não tem nenhuma linha de produto abaixo do cabeçalho.');
    return { itens, col, aba: t.aba, semCod, semCli: itens.filter((x) => !x[2]).length };
  }

  // Planilha de OS (uma linha por OS) e, opcional, a de Observações (OS + texto da montagem).
  // Uma OS liga ao produto pelo código no título ("6304.5451 ..." → 5451) e pelos códigos
  // "modelo.código" escritos nas observações, que é onde ficam as OS com vários produtos.
  const RX_COD_OBS = /(?<![\d.,])(\d{4,5})\.(\d{3,6})(?!\d)/g;
  const limpaOS = (v) => texto(v).replace(/\.0+$/, '').replace(/\.$/, '').trim();
  function codTitulo(tit) { const m = String(tit || '').match(/^\s*(\d+)(?:\.(\d+))?/); return m ? (m[2] || m[1]) : ''; }
  function linhaDoProduto(obs, cod) {
    const linhas = String(obs || '').split(/\r?\n/);
    const rx = new RegExp('(?<![\\d.,])\\d{4,5}\\.' + cod + '(?!\\d)');
    const out = [];
    for (let i = 0; i < linhas.length; i++) {
      if (!rx.test(linhas[i])) continue;
      const pedaco = [linhas[i]];
      for (let j = i + 1; j < linhas.length; j++) { const l = linhas[j].trim(); if (!l || /^[-*]/.test(l) || /(?<![\d.,])\d{4,5}\.\d{3,6}(?!\d)/.test(l)) break; pedaco.push(l); }
      out.push(pedaco.map((l) => l.trim().replace(/^-\s*/, '')).join(' · '));
    }
    return out.join(' / ').replace(/\s+/g, ' ').trim();
  }
  const obsResumida = (obs) => String(obs || '').split(/\r?\n/).map((l) => l.trim().replace(/^-\s*/, '')).filter(Boolean).join(' / ').replace(/\s+/g, ' ');
  // Nome da máquina no sistema → setor, como o PCP chama.
  const SETOR_MAQUINA = { comercial01: 'Corte e vinco' };
  function etapaOS(o) {
    if (o.etapa) { const e = o.etapa.trim(); return SETOR_MAQUINA[norm(e)] || e[0].toUpperCase() + e.slice(1).toLowerCase(); }
    return o.prod > 0 ? 'Concluída' : 'Não iniciada';
  }
  const osConcluida = (o) => !o.etapa && o.prod > 0;

  function lerTabelaOS(wb) {
    const t = acharTabela(wb, (h) => h.some((x) => MAP_OS.os.slice(0, 6).includes(x)));
    if (!t) return null;
    const col = acharColunas(t.rows[t.hi], MAP_OS);
    const linhas = [];
    for (let i = t.hi + 1; i < t.rows.length; i++) {
      const r = t.rows[i]; const g = (c) => col[c] === undefined ? '' : r[col[c]];
      const os = limpaOS(g('os'));
      if (!/^\d+$/.test(os)) continue; // pula cabeçalho repetido e o rodapé "Filtros aplicados"
      const ab = g('abert');
      linhas.push({ os, nome: texto(g('nome')), cod: texto(g('cod')).replace(/\.0+$/, ''), etapa: col.etapa === undefined ? '' : String(g('etapa') ?? '').trim(), prev: texto(g('prev')), qtd: num(g('qtd')), prod: num(g('prod')), abert: ab instanceof Date ? ab.getTime() : (typeof ab === 'number' && ab > 30000 && ab < 80000) ? Math.round((ab - 25569) * 864e5) : 0, obs: col.obs === undefined ? '' : String(g('obs') ?? '') });
    }
    return { col, linhas, aba: t.aba };
  }

  async function importarOS(files) {
    let ordens = null, obsMap = null; const nomes = [];
    for (const f of files) {
      const t = lerTabelaOS(await lerArquivo(f));
      if (!t) throw new Error('Não achei a coluna de OS em “' + f.name + '”. A planilha precisa ter uma coluna chamada “O.S” (ou “OS”, “Ordem de serviço”).');
      nomes.push(f.name);
      const soObs = t.col.obs !== undefined && t.col.nome === undefined && t.col.cod === undefined;
      if (soObs) { obsMap = obsMap || new Map(); t.linhas.forEach((l) => obsMap.set(l.os, l.obs)); }
      else {
        if (t.col.cod === undefined && t.col.nome === undefined) throw new Error('Em “' + f.name + '” não achei a coluna do produto (Título, Código ou Descrição) para ligar cada OS ao produto.');
        ordens = t;
        if (t.col.obs !== undefined) { obsMap = obsMap || new Map(); t.linhas.forEach((l) => { if (l.obs) obsMap.set(l.os, l.obs); }); }
      }
    }
    if (!ordens && !obsMap) throw new Error('Nenhuma planilha de OS selecionada.');
    return { ordens, obsMap, nomes };
  }

  // Monta, para cada produto do site, a OS em aberto mais recente, a etapa, a previsão e a observação.
  function vincularOS(res, limpar) {
    const tabs = ['jit', 'gen'].filter((t) => state.docs[t]);
    const porOS = new Map(); const porCod = new Map();
    const add = (cod, o, via) => { if (!cod) return; if (!porCod.has(cod)) porCod.set(cod, new Map()); if (!porCod.get(cod).has(o.os)) porCod.get(cod).set(o.os, via); };
    let ultima = 0;
    if (res.ordens) res.ordens.linhas.forEach((o) => {
      porOS.set(o.os, o); if (o.abert > ultima) ultima = o.abert;
      const obs = (res.obsMap && res.obsMap.get(o.os)) || '';
      const doObs = [...obs.matchAll(RX_COD_OBS)].map((m) => m[2]);
      // Título só com o número do modelo ("8804 POTE DE PAPEL") não é código de produto quando as observações listam os produtos.
      const tituloComProduto = /^\s*\d+\.\d+/.test(o.nome) || !doObs.length;
      if (o.cod) add(o.cod, o, 'titulo'); else if (tituloComProduto) add(codTitulo(o.nome), o, 'titulo');
      doObs.forEach((c) => add(c, o, 'obs'));
    });
    // Produto sem OS no site só ganha OS aberta nos últimos 30 dias da planilha: as mais antigas sem apontamento costumam estar paradas ou já entregues.
    const recente = ultima ? ultima - 30 * 864e5 : 0;
    const st = { ligados: 0, viaObs: 0, manual: 0, limpos: 0, mudou: 0, obs: 0, amostra: [] };
    const out = {};
    for (const t of tabs) {
      out[t] = state.docs[t].itens.map((x) => {
        const y = x.slice(); const cod = String(y[0]); const atual = String(y[7] || '').trim();
        if (!res.ordens) { // só observações: usa a OS que já está no produto
          const obs = res.obsMap.get(atual);
          if (atual && obs != null) { y[10] = linhaDoProduto(obs, cod) || obsResumida(obs); st.obs++; }
          return y;
        }
        const cands = new Map(porCod.get(cod) || []);
        const cur = atual ? porOS.get(atual) : null;
        if (cur && !cands.has(atual)) cands.set(atual, 'manual');
        const limite = cur ? cur.abert : recente; // com OS no site: só troca por uma OS aberta depois dela
        const abertas = [...cands.keys()].map((n) => porOS.get(n)).filter((o) => (o === cur || o.abert >= limite) && !osConcluida(o))
          .sort((a, b) => (b.abert - a.abert) || (Number(b.os) - Number(a.os)));
        if (!abertas.length) {
          if (limpar && atual) { y[7] = ''; y[8] = ''; y[9] = ''; y[10] = ''; y[14] = ''; st.limpos++; }
          return y;
        }
        const o = abertas[0]; const via = cands.get(o.os);
        st.ligados++; if (via === 'obs') st.viaObs++; if (via === 'manual') st.manual++;
        const antes = [y[7], y[8], y[9]].join('|');
        y[9] = o.prev || (atual === o.os ? y[9] : '');
        y[7] = o.os; y[8] = etapaOS(o);
        const outras = abertas.slice(1).map((a) => a.os);
        while (y.length < 14) y.push(null);
        y[14] = outras.join(', ');
        const obs = res.obsMap && res.obsMap.get(o.os);
        if (obs != null) { y[10] = linhaDoProduto(obs, cod) || obsResumida(obs); st.obs++; }
        if ([y[7], y[8], y[9]].join('|') !== antes) { st.mudou++; st.amostra.push({ cod, nome: y[1], de: x[7] || '—', os: y[7], etapa: y[8], prev: y[9], outras: y[14] }); }
        return y;
      });
    }
    return { out, st, tabs };
  }

  // Atualiza os produtos que já estão no site, pelo código. Campos que a planilha não traz ficam como estão.
  function mesclarEstoque(res) {
    const doArq = new Map(); res.itens.forEach((x) => { if (x[0] && !doArq.has(x[0])) doArq.set(x[0], x); });
    const c = res.col; const out = {}; const usados = new Set(); let atual = 0, faltaram = 0;
    for (const t of ['jit', 'gen']) {
      const doc = state.docs[t]; if (!doc || !doc.itens.length) continue;
      let n = 0;
      const itens = doc.itens.map((x) => {
        const f = doArq.get(x[0]);
        if (!f) { faltaram++; return x; }
        usados.add(x[0]); n++;
        const y = x.slice();
        y[3] = f[3]; y[5] = f[5]; y[6] = f[6]; y[11] = f[11];
        if (c.cx !== undefined) y[4] = f[4];
        if (c.os !== undefined) y[7] = f[7];
        if (c.etapa !== undefined) y[8] = f[8];
        if (c.prev !== undefined) y[9] = f[9];
        if (c.obs !== undefined) y[10] = f[10];
        if (c.entrega !== undefined) y[12] = f[12];
        if (c.lead !== undefined) y[13] = f[13];
        return y;
      });
      out[t] = { itens, n }; atual += n;
    }
    const novos = res.itens.filter((x) => x[0] && !usados.has(x[0]));
    return { out, atual, faltaram, novos };
  }

  function chips(col, map, obrig) {
    if (obrig) return Object.keys(map).map((c) => col[c] !== undefined ? '<span class="col ok">' + (NOMES[c] || c) + '</span>' : obrig.includes(c) ? '<span class="col miss">' + (NOMES[c] || c) + ' (não achei)</span>' : '<span class="col">' + (NOMES[c] || c) + ': mantém o do site</span>').join(''); return Object.keys(map).map((c) => '<span class="col ' + (col[c] !== undefined ? 'ok' : 'miss') + '">' + (NOMES[c] || c) + (col[c] !== undefined ? '' : ' (não achei)') + '</span>').join(''); }

  function dialogo(html) {

  }

  let modo = 'estoque';
  $('imp-estoque').addEventListener('click', () => { modo = 'estoque'; $('file').multiple = false; $('file').value = ''; $('file').click(); });
  $('imp-os').addEventListener('click', () => { modo = 'os'; $('file').multiple = true; $('file').value = ''; toast('Selecione a planilha de OS e a de Observações juntas (segure Ctrl).'); $('file').click(); });
  $('file').addEventListener('change', async (e) => {

        const mx = mesclarEstoque(res);

        const ent = res.col.entrega !== undefined;
        const nAba = (t) => t === 'jit' ? 'produtos JIT' : 'genéricos';
        const partes = Object.entries(mx.out).map(([t, o]) => o.n + ' nos ' + nAba(t));
        const antes = new Map(); Object.values(state.docs).forEach((d) => d && d.itens.forEach((x) => { if (!antes.has(x[0])) antes.set(x[0], x); }));
        const amostra = vazio ? res.itens.slice(0, 5) : res.itens.filter((x) => antes.has(x[0])).slice(0, 5);
        dialogo('<h2 id="dlg-t">Importar planilha de estoque</h2>'

          + (vazio

              + (mx.faltaram ? '<p class="warn">' + mx.faltaram + ' produtos do site não vieram nesta planilha e ficam com os números anteriores.</p>' : '')
              + (mx.novos.length ? '<p class="meta">' + mx.novos.length + ' produtos da planilha não estão no site e ficam de fora.</p><label class="check" for="add-novos"><input type="checkbox" id="add-novos"><span>Adicionar esses ' + mx.novos.length + ' produtos na aba ' + nomeAba + '</span></label>' : ''))
          + '<div class="cols">' + chips(res.col, MAP_EST, ['nome', 'media', 'estoque', 'emp']) + '</div>'
          + (res.semCod ? '<p class="warn">' + res.semCod + ' linhas vieram sem código e não dá para ligá-las a nenhum produto.</p>' : '')
          + '<div class="prev"><table><thead><tr><th>Descrição produto</th><th class="n">Estoque</th><th class="n">Empenhado</th><th class="n">Média</th>' + (ent ? '<th class="n">Entrega pendente</th>' : '') + '</tr></thead><tbody>'
          + amostra.map((x) => { const v = antes.get(x[0]); return '<tr><td style="white-space:normal">' + esc(x[0]) + ' - ' + esc(x[1]) + '</td><td class="n">' + (v && v[5] !== x[5] ? '<span class="muted">' + fmt(v[5]) + ' → </span>' : '') + fmt(x[5]) + '</td><td class="n">' + fmt(x[6]) + '</td><td class="n">' + fmt(x[3]) + '</td>' + (ent ? '<td class="n">' + fmt(x[12] || 0) + '</td>' : '') + '</tr>'; }).join('')
          + '</tbody></table></div><p class="meta">Mostrando 5 produtos como exemplo.</p>'
          + '<div class="row-end"><button class="btn quiet" type="button" data-cancel>Cancelar</button><button class="btn solid" type="button" id="ok">' + (vazio ? 'Carregar ' + res.itens.length + ' produtos' : 'Atualizar ' + mx.atual + ' produtos') + '</button></div>');
        $('ok').addEventListener('click', async () => {
          const addNovos = !!($('add-novos') && $('add-novos').checked);
          $('ok').disabled = true; $('ok').textContent = 'Salvando…';
          const agora = new Date().toISOString();
          try {
            if (vazio) {
              await state.db.doc('estoque/' + aba).set({ itens: res.itens, atualizadoEm: agora, arquivo: file.name });
              fechar(); toast('Estoque carregado: ' + res.itens.length + ' produtos.'); return;
            }
            if (addNovos) { const alvo = mx.out[aba] || { itens: (state.docs[aba]?.itens || []).slice(), n: 0 }; alvo.itens = alvo.itens.concat(mx.novos); alvo.n += mx.novos.length; mx.out[aba] = alvo; }
            for (const [t, o] of Object.entries(mx.out)) {

              await state.db.doc('estoque/' + t).set({ itens: o.itens, atualizadoEm: agora, arquivo: file.name });
            }
            fechar(); toast('Estoque atualizado em ' + mx.atual + ' produtos' + (addNovos && mx.novos.length ? ' e ' + mx.novos.length + ' novos adicionados' : '') + '.');
          } catch (err) { $('ok').disabled = false; $('ok').textContent = 'Tentar de novo'; toast('Não deu para salvar. Confira a conexão e tente de novo.', true); }
        });
      } else {
        const res = await importarOS([...e.target.files]);
        const completa = !!(res.ordens && res.ordens.col.abert !== undefined);
        const prever = (limpar) => vincularOS(res, limpar);
        let v = prever(completa);
        const resumo = () => {
          const s = v.st;
          return res.ordens
            ? '<p style="margin:0;font-size:16px;line-height:1.45"><b>' + s.ligados + ' produtos</b> do site ficam com OS em aberto' + (s.viaObs ? ' (' + s.viaObs + ' deles achados pelas observações)' : '') + '. ' + s.mudou + ' mudam de OS, etapa ou previsão.</p>'
              + (s.manual ? '<p class="meta">' + s.manual + ' produtos mantêm a OS que já estava no site, porque a OS cita o código antigo do produto.</p>' : '')
              + (s.limpos ? '<p class="meta">' + s.limpos + ' produtos ficam sem OS: a última OS deles já foi produzida ou não está na planilha.</p>' : '')
              + (res.obsMap ? '<p class="meta">Observação atualizada em ' + s.obs + ' produtos, com a linha do produto na OS.</p>' : '<p class="warn">Sem a planilha de Observações, as OS com vários produtos (título só com o modelo) não são ligadas. Selecione as duas planilhas juntas, com Ctrl.</p>')
              + (s.amostra.length ? '<div class="prev"><table><thead><tr><th>Produto</th><th>OS</th><th>Última movimentação</th><th>Previsão</th></tr></thead><tbody>' + s.amostra.slice().sort((p, q) => (q.de !== q.os) - (p.de !== p.os)).slice(0, 6).map((a) => '<tr><td style="white-space:normal">' + esc(a.cod) + ' - ' + esc(a.nome) + '</td><td>' + (a.de !== a.os ? '<span class="muted">' + esc(a.de) + ' → </span>' : '') + esc(a.os) + (a.outras ? '<span class="muted"> (+' + esc(a.outras) + ')</span>' : '') + '</td><td>' + esc(a.etapa) + '</td><td>' + esc(a.prev || '—') + '</td></tr>').join('') + '</tbody></table></div><p class="meta">Exemplos de produtos que mudam.</p>' : '')
            : '<p style="margin:0;font-size:16px;line-height:1.45">Só a planilha de Observações: atualiza a observação de <b>' + s.obs + ' produtos</b>, pela OS que já está em cada um.</p>';
        };
        dialogo('<h2 id="dlg-t">Importar OS</h2>'
          + '<p class="meta">' + res.nomes.map(esc).join(' + ') + (res.ordens ? ': <b style="color:var(--paper)">' + res.ordens.linhas.length + ' OS</b>' : '') + (res.obsMap ? ', ' + res.obsMap.size + ' observações' : '') + '.</p>'
          + '<div id="os-resumo" style="display:flex;flex-direction:column;gap:12px">' + resumo() + '</div>'
          + (res.ordens ? '<label class="check" for="limpar"><input type="checkbox" id="limpar"' + (completa ? ' checked' : '') + '><span>Tirar a OS dos produtos que não têm OS em aberto nesta planilha (use quando ela traz todas as OS).</span></label>' : '')
          + '<div class="row-end"><button class="btn quiet" type="button" data-cancel>Cancelar</button><button class="btn solid" type="button" id="ok">Salvar</button></div>');
        if ($('limpar')) $('limpar').addEventListener('change', () => { v = prever($('limpar').checked); $('os-resumo').innerHTML = resumo(); });
        $('ok').addEventListener('click', async () => {
          $('ok').disabled = true; $('ok').textContent = 'Salvando…';
          try {
            for (const t of v.tabs) await state.db.doc('estoque/' + t).update({ itens: v.out[t] });
            await state.db.doc('estoque/os').set({ atualizadoEm: new Date().toISOString(), arquivo: res.nomes.join(' + '), produtos: v.st.ligados });
            fechar(); toast(res.ordens ? 'OS ligadas a ' + v.st.ligados + ' produtos.' : 'Observações atualizadas em ' + v.st.obs + ' produtos.');
          } catch (err) { $('ok').disabled = false; $('ok').textContent = 'Tentar de novo'; toast('Não deu para salvar as OS. Confira a conexão e tente de novo.', true); }
        });
      }
    } catch (err) {
      dialogo('<h2 id="dlg-t">Não deu para ler a planilha</h2><p class="err">' + esc(err.message || 'O arquivo não abriu como planilha. Use um arquivo .xlsx, .xls ou .csv.') + '</p><div class="row-end"><button class="btn solid" type="button" data-cancel>Entendi</button></div>');
    }
  });

  // ---------- relatório "Itens até 45 dias" ----------
  const REL_PADRAO = { prioridades: '', excluirClientes: ['Bar do Alemão SP'], semPrevisao: true };
  function relConfig() { return Object.assign({}, REL_PADRAO, state.relCfg || {}); }
  // A busca da tela vale para os relatórios: com algo digitado, só entram os itens que casam com ela.
  const buscaTxt = () => String(state.q || '').trim();
  const casaBusca = (r) => { const q = norm(state.q); return !q || norm(r.nome).includes(q) || norm(r.cod).includes(q) || norm(r.cli).includes(q); };
  const arqBusca = () => { const b = buscaTxt(); return b ? ' - ' + b.replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 40).trim() : ''; };
  const avisoBusca = () => buscaTxt() ? '<p class="warn">Só entram os itens da busca “' + esc(buscaTxt()) + '”. Para tirar de todos os itens, limpe a caixa de busca.</p>' : '';
  function relItens(cfg) {
    const prio = new Set(String(cfg.prioridades || '').split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean));
    const fora = new Set(cfg.excluirClientes || []);
    const out = []; let base = null; let tirPrio = 0; let tirPrev = 0;
    for (const t of ['jit', 'gen']) {
      const doc = state.docs[t]; if (!doc) continue;
      if (doc.atualizadoEm && (!base || doc.atualizadoEm > base)) base = doc.atualizadoEm;
      doc.itens.forEach((it, i) => {
        const r = computa(it, i, doc.atualizadoEm);
        if (r.semGiro || !r.os) return;
        const dias = Math.round(r.cob);
        if (dias > 45) return;
        if (fora.has(r.cli)) return;
        if (!casaBusca(r)) return;
        // Prioridades O.S entram sempre (mesmo com data de entrega) e saem destacadas em vermelho.

  const PLANO_PADRAO = { prazo: 60, margem: 15, usarLead: false };
  function planoCfg() { const p = Object.assign({}, PLANO_PADRAO, (state.relCfg && state.relCfg.plano) || {}); p.prazo = Math.max(1, Math.round(+p.prazo || 60)); p.margem = Math.max(0, Math.round(+p.margem || 0)); return p; }
  function lerPrev(txt, hoje) {
    const m = String(txt || '').match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/); if (!m) return null;
    let ano = m[3] ? +m[3] : hoje.getFullYear(); if (ano < 100) ano += 2000;
    let d = new Date(ano, +m[2] - 1, +m[1]);
    if (!m[3] && d - hoje > 200 * 864e5) d = new Date(ano - 1, +m[2] - 1, +m[1]);
    return isNaN(d) ? null : d;
  }
  function calcAcoes() {
    const cfg = planoCfg(); const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const abrir = [], atrasadas = [], semPrev = [];
    for (const t of ['jit', 'gen']) {
      const doc = state.docs[t]; if (!doc) continue;
      doc.itens.forEach((it, i) => {
        const r = computa(it, i, doc.atualizadoEm); if (r.semGiro || !casaBusca(r)) return;
        const porDia = r.media / 30, ent = typeof it[12] === 'number' ? it[12] : 0;
        const lead = cfg.usarLead && +it[13] > 0 ? Math.round(+it[13]) : cfg.prazo;
        const cobEnt = (r.disp + ent) / porDia;
        const x = Object.assign({}, r, { tab: t, ent, lead, cobEnt: Math.round(cobEnt) });
        if (!r.os) {
          if (cobEnt < lead + cfg.margem) {
            x.sug = Math.max(1, Math.ceil(porDia * (lead + cfg.margem) - (r.disp + ent)));
            x.antesDaOS = cobEnt < lead;
            abrir.push(x);
          }
        } else {
          const pv = lerPrev(r.prev, hoje);
          if (pv && pv < hoje) { x.atraso = Math.round((hoje - pv) / 864e5); atrasadas.push(x); }
          else if (!r.prev && cobEnt < lead) semPrev.push(x);
        }
      });
    }
    abrir.sort((a, b) => a.cobEnt - b.cobEnt);
    atrasadas.sort((a, b) => b.atraso - a.atraso || a.cobEnt - b.cobEnt);
    semPrev.sort((a, b) => a.cobEnt - b.cobEnt);
    return { cfg, abrir, atrasadas, semPrev };

  // ---------- relatório semanal (compara duas fotos do histórico) ----------
  const isoDia = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const diaBR = (s) => dataBR(isoDia(s));
  const pct = (a, b) => a > 0 ? (b - a) / a * 100 : (b > 0 ? null : 0);
  const pctTxt = (v) => v === null ? '—' : (v > 0 ? '+' : '') + v.toFixed(0).replace('-0', '0') + '%';
  const diasCap = (r) => r.semGiro ? null : Math.max(-999, Math.min(999, Math.round(r.cob)));
  const SIT = [['falta', 'Em ruptura'], ['critico', 'Crítico'], ['atencao', 'Atenção'], ['ok', 'Em dia']];

  function compararFotos(dA, dB) {
    const mapa = (doc) => { const m = new Map(); (doc.itens || []).forEach((it, i) => { if (it[0] && !m.has(it[0])) m.set(it[0], computa(it, i, doc.atualizadoEm)); }); return m; };
    const A = mapa(dA), B = mapa(dB);
    const linhas = [];
    B.forEach((b, cod) => {
      const a = A.get(cod); if (!a) return;
      if (!casaBusca(b)) return;
      if (a.semGiro && b.semGiro) return;
      const da = diasCap(a), db = diasCap(b);
      linhas.push({ cod, nome: b.nome, cli: b.cli, os: b.os, a, b, estA: a.estoque, estB: b.estoque, dispA: a.disp, dispB: b.disp,
        diasA: da, diasB: db, dDias: (db ?? 0) - (da ?? 0), varEst: pct(a.estoque, b.estoque) });
    });
    const validos = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro);
    const conta = (lado) => { const c = { falta: 0, critico: 0, atencao: 0, ok: 0 }; validos.forEach((l) => { const r = l[lado]; const st = !r.semGiro && r.disp <= 0 ? 'falta' : r.st; if (c[st] !== undefined) c[st]++; }); return c; };
    const sit = { a: conta('a'), b: conta('b') };
    const ruptA = sit.a.falta, ruptB = sit.b.falta;
    const sairam = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro && l.dispA <= 0 && l.dispB > 0).sort((x, y) => y.dispB - x.dispB);
    const entraram = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro && l.dispA > 0 && l.dispB <= 0).sort((x, y) => x.dispB - y.dispB);
    const melhoraram = validos.filter((l) => l.dDias > 0 && l.dispB > l.dispA).sort((x, y) => y.dDias - x.dDias);
    const pioraram = validos.filter((l) => l.dDias < 0 && l.dispB < l.dispA).sort((x, y) => x.dDias - y.dDias);
    const somaA = linhas.reduce((s, l) => s + l.estA, 0), somaB = linhas.reduce((s, l) => s + l.estB, 0);
    return { linhas, validos: validos.length, foraGiro: linhas.length - validos.length, sit, ruptA, ruptB, sairam, entraram, melhoraram, pioraram, somaA, somaB };
  }

  function grafSituacao(pdf, x, y, w, h, sit, rotA, rotB, cores) {
    const max = Math.max(1, ...SIT.map(([k]) => Math.max(sit.a[k], sit.b[k])));
    const topo = Math.ceil(max / 10) * 10 || 10;
    const baseY = y + h - 8, alt = h - 16, grupo = w / SIT.length, bw = Math.min(12, grupo / 3.2);
    pdf.setDrawColor(225, 225, 225); pdf.setLineWidth(0.2);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(130, 130, 130);
    for (let i = 0; i <= 4; i++) { const v = topo * i / 4, yy = baseY - alt * i / 4; pdf.line(x, yy, x + w, yy); pdf.text(String(Math.round(v)), x - 1.5, yy + 1, { align: 'right' }); }
    SIT.forEach(([k, lab], i) => {
      const cx = x + grupo * i + grupo / 2;
      [[sit.a[k], [190, 190, 190]], [sit.b[k], cores[k]]].forEach(([v, cor], j) => {
        const hh = alt * v / topo, bx = cx - bw - 0.8 + j * (bw + 1.6);
        pdf.setFillColor(...cor); pdf.rect(bx, baseY - hh, bw, hh, 'F');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7); pdf.setTextColor(60, 60, 60);
        pdf.text(String(v), bx + bw / 2, baseY - hh - 1.3, { align: 'center' });
      });
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(60, 60, 60);
      pdf.text(lab, cx, baseY + 4.5, { align: 'center' });
    });
    pdf.setFillColor(190, 190, 190); pdf.rect(x + w - 62, y, 3, 3, 'F'); pdf.setFontSize(7); pdf.setTextColor(90, 90, 90); pdf.text(rotA, x + w - 58, y + 2.6);
    pdf.setFillColor(60, 60, 60); pdf.rect(x + w - 30, y, 3, 3, 'F'); pdf.text(rotB, x + w - 26, y + 2.6);
  }

  function grafMelhoras(pdf, x, y, w, lista, cor) {
    const top = lista.slice(0, 8); if (!top.length) return y;
    const max = Math.max(1, ...top.map((l) => l.dDias));
    const rotW = 70, bh = 4.2, gap = 2.6;
    top.forEach((l, i) => {
      const yy = y + i * (bh + gap);
      const nome = pdf.splitTextToSize(l.cod + ' ' + l.nome, rotW - 2)[0];
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.8); pdf.setTextColor(60, 60, 60);
      pdf.text(nome, x, yy + bh - 1);
      const bw = (w - rotW - 16) * l.dDias / max;
      pdf.setFillColor(...cor); pdf.rect(x + rotW, yy, Math.max(0.8, bw), bh, 'F');
      pdf.setFont('helvetica', 'bold'); pdf.text('+' + l.dDias + ' d', x + rotW + bw + 1.5, yy + bh - 1);
    });
    return y + top.length * (bh + gap);
  }

    tabela('Saíram da ruptura', 'Tinham disponível zerado ou negativo em ' + diaBR(fotoA) + ' e agora têm saldo.', cmp.sairam,

  function gerarSemanalXLSX(cmp, fotoA, fotoB, nomeAba) {
    const wb = XLSX.utils.book_new();
    const A = diaBR(fotoA), B = diaBR(fotoB);
    const add = (nome, linhas) => { const ws = XLSX.utils.aoa_to_sheet(linhas); ws['!cols'] = linhas[0].map((_, i) => ({ wch: i === 1 ? 58 : 14 })); XLSX.utils.book_append_sheet(wb, ws, nome); };
    const dv = (v) => v === null ? 'Sem giro' : v;
    add('Resumo', [['Relatório semanal de estoque', ''], ['Produtos', nomeAba], ['Período', A + ' a ' + B], ['Busca', buscaTxt() || 'Todos os itens'], [], ['Indicador', A, B],
      ...SIT.map(([k, l]) => [l, cmp.sit.a[k], cmp.sit.b[k]]), ['Estoque total (caixas)', cmp.somaA, cmp.somaB], [],
      ['Saíram da ruptura', cmp.sairam.length], ['Entraram em ruptura', cmp.entraram.length], ['Melhoraram', cmp.melhoraram.length], ['Pioraram', cmp.pioraram.length]]);
    const cab = ['Código', 'Descrição', 'Cliente', 'Estoque ' + A, 'Estoque ' + B, 'Variação estoque', 'Disponível ' + A, 'Disponível ' + B, 'Dias ' + A, 'Dias ' + B, 'Ganho em dias', 'OS'];
    const lin = (l) => [l.cod, l.nome, l.cli, l.estA, l.estB, l.varEst === null ? '' : l.varEst / 100, l.dispA, l.dispB, dv(l.diasA), dv(l.diasB), l.dDias, l.os || ''];
    add('Melhoraram', [cab, ...cmp.melhoraram.map(lin)]);
    add('Saíram da ruptura', [cab, ...cmp.sairam.map(lin)]);
    add('Pioraram', [cab, ...cmp.pioraram.map(lin)]);
    add('Entraram em ruptura', [cab, ...cmp.entraram.map(lin)]);
    add('Comparativo completo', [cab, ...cmp.linhas.slice().sort((x, y) => (x.b.cob) - (y.b.cob)).map(lin)]);
    ['Melhoraram', 'Saíram da ruptura', 'Pioraram', 'Entraram em ruptura', 'Comparativo completo'].forEach((n) => {
      const ws = wb.Sheets[n]; const r = XLSX.utils.decode_range(ws['!ref']);
      for (let i = 1; i <= r.e.r; i++) { const c = ws[XLSX.utils.encode_cell({ r: i, c: 5 })]; if (c && c.t === 'n') c.z = '0%'; }
    });
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

    let atual = null;

        const [fa, fb] = await Promise.all([foto(a), foto(b)]);
        const cmp = compararFotos(fa, fb); atual = { cmp, a, b };
        $('sem-prev').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;color:var(--paper)">'
          + [['Em ruptura', cmp.ruptA + ' → ' + cmp.ruptB], ['Saíram da ruptura', cmp.sairam.length], ['Entraram em ruptura', cmp.entraram.length], ['Melhoraram', cmp.melhoraram.length], ['Pioraram', cmp.pioraram.length], ['Estoque total', pctTxt(pct(cmp.somaA, cmp.somaB))]]
            .map(([k, v]) => '<div style="padding:10px 12px;border:1px solid var(--line);border-radius:10px"><div class="meta" style="font-size:13px">' + k + '</div><b style="font-size:20px">' + v + '</b></div>').join('')
          + '</div>' + (cmp.melhoraram[0] ? '<p class="meta" style="margin-top:10px">Maior melhora: ' + esc(cmp.melhoraram[0].cod + ' ' + cmp.melhoraram[0].nome) + ' (+' + cmp.melhoraram[0].dDias + ' dias, estoque ' + pctTxt(cmp.melhoraram[0].varEst) + ').</p>' : '');
        $('sem-pdf').disabled = $('sem-xlsx').disabled = false;
      } catch (e) { $('sem-prev').innerHTML = '<span style="color:var(--falta)">Não deu para carregar as fotos. Tente de novo.</span>'; }
    };
    $('sem-a').addEventListener('change', prever); $('sem-b').addEventListener('change', prever);
    const nomeBase = () => 'Relatorio semanal ' + (aba === 'jit' ? 'JIT' : 'Genericos') + ' ' + diaBR(atual.a).replace(/\//g, '-') + ' a ' + diaBR(atual.b).replace(/\//g, '-') + arqBusca();
    $('sem-pdf').addEventListener('click', () => {
      if (!atual) return;
      if (!window.jspdf || !window.jspdf.jsPDF) { toast('O gerador de PDF não carregou. Recarregue a página e tente de novo.', true); return; }
      try { baixar(gerarSemanalPDF(atual.cmp, atual.a, atual.b, nomeAba), nomeBase() + '.pdf'); toast('Relatório semanal baixado.'); } catch (e) { toast('Não deu para gerar o PDF. Tente de novo.', true); }
    });
    $('sem-xlsx').addEventListener('click', () => {
      if (!atual) return;
      try { baixar(gerarSemanalXLSX(atual.cmp, atual.a, atual.b, nomeAba), nomeBase() + '.xlsx'); toast('Planilha do relatório semanal baixada.'); } catch (e) { toast('Não deu para gerar a planilha. Tente de novo.', true); }
    });
    prever();
  });

  // ---------- dados (Supabase) ----------
  const SUPA_URL = 'https://mnvyitxutjvsoqgfftxn.supabase.co';
  const SUPA_KEY = 'sb_publishable_Oxodo29Euz7H_cCA1fRNCQ_Iobo-dqp';
  const sb = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;
  const linhas = {};
  function aplicar(id, data) {
    linhas[id] = data;
    if (id === 'jit' || id === 'gen') state.docs[id] = data && Array.isArray(data.itens) ? data : null;
    if (id === 'os') state.osInfo = data;
    if (id === 'config') state.relCfg = data;
  }
  async function gravar(id, data) {
    const { error } = await sb.from('estoque_pcp').upsert({ id, data }, { onConflict: 'id' });
    if (error) throw error;
    aplicar(id, data);
    rerender(id === state.tab && !state.quieto);
  }
  state.db = {
    doc: (path) => {
      const id = path.split('/')[1];
      return {
        set: (data) => gravar(id, data),
        update: (parte) => gravar(id, Object.assign({}, linhas[id] || {}, parte))
      };
    }
  };
  async function carregar() {
    const { data, error } = await sb.from('estoque_pcp').select('id,data');
    if (error) { $('conn').textContent = 'Não deu para carregar os dados. Recarregue a página.'; return; }
    ['jit', 'gen', 'os', 'config'].forEach((id) => aplicar(id, null));
    (data || []).forEach((r) => aplicar(r.id, r.data));
    rerender(true);
  }
  let canal = null;
  function ouvir() {
    if (canal) return;
    canal = sb.channel('estoque_pcp').on('postgres_changes', { event: '*', schema: 'public', table: 'estoque_pcp' }, (p) => {
      if (p.new && p.new.id) { aplicar(p.new.id, p.new.data); if (!document.querySelector('.edt-in')) rerender(false); }
    }).subscribe();
  }
  function telaLogin(msg) {
    layer.innerHTML = '<div class="overlay center"><form class="dialog login" id="login" novalidate aria-labelledby="lg-t">'
      + '<span class="seal" hidden aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>'
      + '<h2 id="lg-t">Entrar no Controle Estoque PCP</h2>'
      + '<p class="meta">Use o mesmo usuário e senha dos outros painéis da ProFood.</p>'
      + (msg ? '<p class="err" role="alert">' + esc(msg) + '</p>' : '')
      + '<label class="field" for="lg-user">Usuário<input id="lg-user" autocomplete="username" placeholder="Ex.: matheuspcp" required></label>'
      + '<label class="field" for="lg-pass">Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>'
      + '<button class="btn solid" type="submit" id="lg-ok" style="justify-content:center">Entrar</button>'
      + '</form></div>';
    $('lg-user').focus();
    $('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      let u = $('lg-user').value.trim().toLowerCase(); const s = $('lg-pass').value;
      if (!u || !s) { telaLogin('Preencha o usuário e a senha.'); return; }
      if (!u.includes('@')) u += '@profood.local';
      $('lg-ok').disabled = true; $('lg-ok').textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email: u, password: s });
      if (error) { telaLogin('Usuário ou senha incorretos. Confira e tente de novo.'); return; }
    });
  }
  async function entrou(session) {
    fechar();
    const email = session.user.email || '';
    const { data: pode } = await sb.rpc('estoque_pcp_pode');
    state.canEdit = !!pode;
    $('conn').innerHTML = '<span>' + esc(email.replace('@profood.local', '')) + '</span> <button class="btn quiet" type="button" id="sair" style="min-height:36px;padding:0 12px;margin-left:8px">Sair</button>';
    $('sair').addEventListener('click', async () => { await sb.auth.signOut(); });
    if (!pode) { $('conn').insertAdjacentHTML('afterbegin', '<span style="color:var(--falta)">Este usuário não tem acesso ao estoque. </span>'); render(); return; }
    await carregar();
    ouvir();
  }

  render();
  if (!sb) { $('conn').textContent = 'O banco de dados não carregou. Confira a internet e recarregue a página.'; }
  else {
    $('conn').textContent = '';
    sb.auth.onAuthStateChange((ev, session) => {
      if (session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => entrou(session), 0);
      if (!session) { if (canal) { sb.removeChannel(canal); canal = null; } state.canEdit = false; ['jit', 'gen', 'os', 'config'].forEach((id) => aplicar(id, null)); $('conn').textContent = ''; render(); telaLogin(); }
    });
  }
})();
</script>
</body>
</html>
