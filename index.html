<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Controle Estoque PCP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho com selo de caixa, abas em trilho, barra de ferramentas única, e a planilha num painel de papelão escuro; cada linha é "etiquetada" da esquerda para a direita ao carregar. Tema escuro por escolha. */
:root{
  --bg:#0D0C0B;          /* fundo: preto quente */
  --surface:#161513;     /* painéis */
  --surface-2:#1E1C19;   /* cabeçalho da tabela, campos */
  --line:#2D2A26;        /* bordas */
  --rule:#221F1C;        /* divisórias das linhas */
  --raise:#1B1916;       /* hover */
  --paper:#F2EDE6;       /* texto */
  --kraft:#A69C90;       /* texto secundário */
  --dim:#6E665D;         /* vazio */
  --accent:#D4A373;      /* kraft: cor da marca */
  --accent-ink:#1A120A;  /* texto sobre o kraft */
  --falta:#F0555B;
  --critico:#EE8A3E;
  --atencao:#E5C15C;
  --ok:#5FC49B;
  --sem:#7A736B;
  --obs:#D8C29E;
  --display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'Figtree','Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px;font-variant-numeric:tabular-nums}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#14120F 0%,var(--bg) 100%)}
header .wrap{padding-block:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brandbox{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--kraft);letter-spacing:0}
.updated{color:var(--kraft);font-size:14px}
main.wrap{padding-block:28px 80px;display:flex;flex-direction:column;gap:16px}
.tabsrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:0;border-radius:9px;background:none;color:var(--kraft);font-family:var(--display);font-size:17px;font-weight:600;cursor:pointer;transition:background-color .2s,color .2s}
.tab span{min-width:28px;padding:2px 8px;border-radius:999px;background:var(--surface-2);font-family:var(--body);font-size:13px;font-weight:600;color:var(--kraft);text-align:center}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{background:rgba(26,18,10,.16);color:var(--accent-ink)}
.tab:hover:not([aria-selected="true"]){color:var(--paper);background:var(--raise)}
.meta{color:var(--kraft);font-size:14px;margin:0}
#tabmeta{display:inline-flex;align-items:center;gap:8px}
#tabmeta:not(:empty)::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(95,196,155,.18)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.filters{display:contents}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--paper);font-family:var(--body);font-size:15px;font-weight:600;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--accent);color:var(--paper)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.solid:hover{background:#E0B385;border-color:#E0B385;color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn svg{flex-shrink:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:340px;max-width:100%}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;color:var(--paper);font-family:var(--body);font-size:15px}
.sheet{max-height:78vh;overflow:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table{width:100%;min-width:1840px;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;padding:13px 14px;font-size:13px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--line);white-space:nowrap}
th.n,td.n{text-align:right}
th:first-child{min-width:460px;padding-left:20px}
td{padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:middle}
td:first-child{white-space:normal;padding-left:20px}
td.obs{white-space:normal;min-width:220px;font-size:14px;color:var(--obs)}
tr.r{transition:background-color .2s}
tr.r:hover{background:var(--raise)}
tbody tr:last-child td{border-bottom:0}
.item{display:flex;align-items:flex-start;gap:12px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:7px}
.desc{display:flex;flex-direction:column;gap:3px;padding:2px 0;border:0;background:none;color:var(--paper);font-family:var(--body);font-size:15px;font-weight:500;text-align:left;cursor:pointer}
.desc .cod{font-size:12px;font-weight:600;color:var(--accent)}
.desc .cli{font-size:13px;color:var(--kraft);font-weight:400}
.desc:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent)}
.pill{display:inline-block;min-width:54px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:14px;text-align:center}
.muted{color:var(--dim)}
/* etiquetagem: uma linha kraft corre embaixo da linha e as células aparecem da esquerda para a direita */
@keyframes scan{0%{background-size:0% 2px;background-position:0% 100%}50%{background-size:100% 2px;background-position:0% 100%}50.1%{background-size:100% 2px;background-position:100% 100%}100%{background-size:0% 2px;background-position:100% 100%}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.anim td{background-image:linear-gradient(var(--accent),var(--accent));background-repeat:no-repeat;background-size:0% 2px;background-position:0% 100%;animation:scan .2s linear forwards;animation-delay:calc(var(--r) + var(--k))}
.anim td>.v{display:inline-block;clip-path:inset(0 100% 0 0);animation:reveal .24s ease-out forwards;animation-delay:calc(var(--r) + var(--k) + .05s)}
.anim td>.v.item,.v.item{display:flex}
.login{max-width:420px;align-items:stretch}
.login .seal{width:48px;height:48px;border-radius:12px}
#conn{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.empty{padding:56px 20px;text-align:center;color:var(--kraft);font-size:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong{font-family:var(--display);font-size:22px;font-weight:700;color:var(--paper)}
/* janelas */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:.4;transform:translateX(36px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.72);backdrop-filter:blur(3px);display:flex;animation:fade .25s ease both;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.overlay.center{align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.side{justify-content:flex-end}
.dialog{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.22,.61,.36,1) both}
.dialog h2,.drawer h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;text-wrap:balance}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.col{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2)}
.col.ok{color:var(--ok);background:rgba(95,196,155,.12)}
.col.miss{color:var(--falta);background:rgba(240,85,91,.12)}
.warn{margin:0;padding:12px 14px;border-radius:10px;background:rgba(212,163,115,.1);color:var(--obs);font-size:14px;line-height:1.45}
.err{margin:0;padding:12px 14px;border-radius:10px;background:rgba(240,85,91,.12);color:var(--falta);font-size:15px;line-height:1.45}
.prev{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.prev table{min-width:900px;font-size:14px}
.prev th{position:static}
.prev td:first-child{padding-left:14px}
.row-end{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;margin-top:1px}
.drawer{width:470px;max-width:100%;height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:22px;animation:slide .35s cubic-bezier(.22,.61,.36,1) both}
.big{display:flex;align-items:baseline;gap:12px;padding:18px;border-radius:14px;background:var(--surface-2);border-left:5px solid var(--sem)}
.big b{font-family:var(--display);font-size:52px;font-weight:700;line-height:1}
dl{margin:0;border-radius:12px;border:1px solid var(--line);padding:4px 16px}
dl div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule)}
dl div:last-child{border-bottom:0}
dt{color:var(--kraft)}
dd{margin:0;text-align:right;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.seg button{min-height:42px;border-radius:9px;border:0;background:transparent;color:var(--kraft);font-family:var(--body);font-size:15px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--kraft)}
.field input,.field textarea{min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:16px}
.close{width:44px;height:44px;flex-shrink:0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;width:min(440px,calc(100% - 32px));padding:14px 18px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--surface-2);color:var(--paper);font-size:15px;font-weight:600;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:rise .35s cubic-bezier(.22,.61,.36,1) both}
.toast.bad{border-left-color:var(--falta)}
@media (max-width:640px){.toolbar{padding:10px}.search{width:100%}.tab{padding:0 12px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.anim td>.v{clip-path:none}}
</style>

<header>
  <div class="wrap">
    <div class="brandbox">
      <span class="seal" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>
      <h1 class="brand">Controle Estoque PCP<small>ProFood Embalagens</small></h1>
    </div>
    <span class="updated" id="conn"></span>
  </div>
</header>

<main class="wrap">
  <div class="tabsrow">
    <div class="tabs" role="tablist" aria-label="Tipo de produto">
      <button class="tab" role="tab" id="tab-jit" data-tab="jit" aria-selected="true">Produtos JIT <span id="n-jit">0</span></button>
      <button class="tab" role="tab" id="tab-gen" data-tab="gen" aria-selected="false">Genéricos <span id="n-gen">0</span></button>
    </div>
    <p class="meta" id="tabmeta"></p>
  </div>

  <section class="toolbar" aria-label="Importar e buscar">
    <div class="filters">
      <div class="actions" id="actions">
        <button class="btn solid" id="imp-estoque" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 3h14"></path></svg>
          Importar planilha de estoque
        </button>
        <button class="btn" id="imp-os" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 3h14"></path></svg>
          Importar planilha de OS
        </button>
        <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
        <button class="btn quiet" id="relatorio" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path><path d="M9 13h6"></path><path d="M9 17h6"></path></svg>
          Gerar relatório de 45 dias
        </button>
        <button class="btn quiet" id="semanal" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg>
          Relatório semanal
        </button>
      </div>
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--kraft)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" id="q" placeholder="Buscar código, produto ou cliente" aria-label="Buscar produto">
      </label>
    </div>
  </section>

  <div class="sheet">
    <table>
      <thead>
        <tr>
          <th>Descrição produto</th>
          <th class="n">Média mensal</th>
          <th class="n">Qtd. por caixa</th>
          <th class="n">Estoque</th>
          <th class="n">Empenhado</th>
          <th class="n">Disponível</th>
          <th class="n">Entrega pendente</th>
          <th class="n">Dias</th>
          <th class="n">Dias c/ entrega</th>
          <th>Ruptura</th>
          <th>OS</th>
          <th>Última movimentação</th>
          <th>Previsão</th>
          <th>Observação</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function () {
  const ST = {
    falta: { label: 'Em falta', cor: 'var(--falta)', bg: 'rgba(240,85,91,.16)' },
    critico: { label: 'Crítico', cor: 'var(--critico)', bg: 'rgba(238,138,62,.15)' },
    atencao: { label: 'Atenção', cor: 'var(--atencao)', bg: 'rgba(229,193,92,.14)' },
    ok: { label: 'Em dia', cor: 'var(--ok)', bg: 'rgba(95,196,155,.12)' },
    sem: { label: 'Sem giro', cor: 'var(--sem)', bg: 'rgba(122,115,107,.16)' }
  };
  const ORDER = ['falta', 'critico', 'atencao', 'ok', 'sem'];
  const CLI = [['BATEL GRILL','Batel Grill'],['MR FRITZ','Mr. Fritz'],['CACHORRAO','Cachorrão do Claudião'],['CACHORRÃO','Cachorrão do Claudião'],['BUTECO','Buteco Seu Rufino'],['MANE','Mané'],['MANÉ','Mané'],['SODIE','Sodiê'],['SODIÊ','Sodiê'],['JAH','Jah Açaí'],['THE BEST','The Best Açaí'],['THE BETS','The Best Açaí'],['ESPETTO','Espetto Carioca'],['COCO BAMBU','Coco Bambu'],['ALEMAO','Bar do Alemão SP'],['ALEMÃO','Bar do Alemão SP'],['TT BURGER','TT Burger'],['CAMARADA','Camarada Camarão'],['VASTO','Vasto'],['NANICA','Nanica'],['GREENJOY','Greenjoy'],['SEVERO','Severo Burger'],['PANTANAL','Pantanal'],['OGGI','Oggi Sorvetes'],['DOG KING','Dog King'],['HORA DO PASTEL','Hora do Pastel'],['PROFOOD','ProFood'],['IPT','IPT'],['BATATA INGLESA','Batata Inglesa'],['AGUA DOCE','Água Doce'],['ÁGUA DOCE','Água Doce'],['GREEN JOY','Greenjoy']];

  const state = { tab: 'jit', status: 'todos', q: '', docs: { jit: null, gen: null }, osInfo: null, sel: null, canEdit: false, db: null, anim: true };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(n).toLocaleString('pt-BR');
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const cliente = (nome) => { const u = ' ' + String(nome).toUpperCase() + ' '; for (const [k, v] of CLI) { if (new RegExp('[^A-ZÀ-Ú]' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[^A-ZÀ-Ú]').test(u)) return v; } return ''; };
  const dd = (d) => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
  const dataLonga = (iso) => { const d = new Date(iso); return dd(d) + '/' + d.getFullYear() + ' às ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  function computa(it, i, baseIso) {
    const [cod, nome, cli, media, cx, estoque, emp, os, etapa, prev, obs, sem, entrega] = it;
    const disp = estoque - emp;
    const temEnt = typeof entrega === 'number';
    const porDia = media / 30;
    const semGiro = !!sem || !(porDia > 0);
    const cob = semGiro ? 1e9 : disp / porDia;
    const st = semGiro ? 'sem' : disp < 0 ? 'falta' : cob < 20 ? 'critico' : cob < 40 ? 'atencao' : 'ok';
    let rupt = '—', ruptDias = null;
    if (!semGiro) {
      const base = baseIso ? new Date(baseIso) : new Date();
      base.setHours(0, 0, 0, 0);
      const d = new Date(base); d.setDate(d.getDate() + Math.round(cob));
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      ruptDias = disp <= 0 ? Math.min(0, Math.round((d - hoje) / 864e5)) : Math.round((d - hoje) / 864e5);
      rupt = ruptDias <= 0 ? 'Já em ruptura' : dd(d) + ', em ' + ruptDias + (ruptDias === 1 ? ' dia' : ' dias');
    }
    const cobEnt = semGiro ? null : (disp + (temEnt ? entrega : 0)) / porDia;
    return { i, cod, nome, cli: cli || 'Genérico', media, cx, estoque, emp, disp, os, etapa, prev, obs, sem, semGiro, cob, st, rupt, ruptDias, dias: semGiro ? (sem || 'Sem giro') : fmt(cob),
      entregaTxt: temEnt ? fmt(entrega) : '', diasEnt: cobEnt === null ? '' : fmt(cobEnt), cobEnt };
  }

  function lista(tab) {
    const doc = state.docs[tab];
    if (!doc || !Array.isArray(doc.itens)) return [];

  // ---------- importação ----------
  const MAP_EST = {

  };
  const NOMES = { cod: 'Código', nome: 'Descrição produto', media: 'Média mensal', cx: 'Qtd. por caixa', estoque: 'Estoque', emp: 'Empenhado', entrega: 'Entrega pendente', dias: 'Dias', os: 'OS', etapa: 'Última movimentação', prev: 'Previsão', obs: 'Observação' };

  function acharColunas(header, map) {
    const h = header.map(norm); const res = {}; const usados = new Set();
    for (const [campo, alts] of Object.entries(map)) {
      let idx = -1;
      for (const a of alts) { idx = h.findIndex((x, j) => x === a && !usados.has(j)); if (idx >= 0) break; }
      if (idx < 0) for (const a of alts) { if (a.length < 4) continue; idx = h.findIndex((x, j) => x.startsWith(a) && !usados.has(j)); if (idx >= 0) break; }
      if (idx >= 0) { res[campo] = idx; usados.add(idx); }
    }
    return res;
  }
  function num(v) {
    if (typeof v === 'number') return v;
    const s = String(v ?? '').trim(); if (!s) return 0;
    const t = s.replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.');
    const n = parseFloat(t); return isNaN(n) ? 0 : n;
  }
  function texto(v) {
    if (v instanceof Date) return dd(v);
    if (typeof v === 'number' && v > 30000 && v < 80000) { const d = XLSX.SSF.parse_date_code(v); return String(d.d).padStart(2, '0') + '/' + String(d.m).padStart(2, '0'); }
    return String(v ?? '').trim();
  }
  function lerArquivo(file) {
    return new Promise((ok, fail) => {
      const fr = new FileReader();
      fr.onload = () => { try { const wb = XLSX.read(fr.result, { type: 'array', cellDates: true }); ok(wb); } catch (e) { fail(e); } };
      fr.onerror = () => fail(fr.error);
      fr.readAsArrayBuffer(file);
    });
  }
  function acharTabela(wb, testa) {
    for (const nome of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, defval: '', raw: true });
      for (let i = 0; i < Math.min(rows.length, 25); i++) { if (testa(rows[i].map(norm))) return { rows, hi: i, aba: nome }; }
    }
    return null;
  }
  function codigoDe(cod, nome) {
    let c = texto(cod).replace(/\.0+$/, '');
    let n = texto(nome);
    const m = n.match(/^\s*(\d+)\s*-\s*(.*)$/);
    if (m) { if (!c) c = m[1]; n = m[2]; }
    return [c, n];
  }

  async function importarEstoque(file) {
    const wb = await lerArquivo(file);
    const t = acharTabela(wb, (h) => h.includes('estoque') && h.some((x) => x.startsWith('descricao') || x === 'produto'));
    if (!t) throw new Error('Não achei o cabeçalho da planilha. Ela precisa ter as colunas “Descrição produto” e “Estoque” nas primeiras linhas.');
    const col = acharColunas(t.rows[t.hi], MAP_EST);
    const falta = ['nome', 'media', 'estoque', 'emp'].filter((c) => col[c] === undefined);
    if (falta.length) throw new Error('Faltam colunas obrigatórias: ' + falta.map((c) => NOMES[c]).join(', ') + '.');
    const itens = []; let semCod = 0;
    for (let i = t.hi + 1; i < t.rows.length; i++) {
      const r = t.rows[i]; const g = (c) => col[c] === undefined ? '' : r[col[c]];
      const bruto = texto(g('nome'));
      if (!bruto || norm(bruto).startsWith('descricao') || norm(bruto).startsWith('produto')) continue;
      const [cod, nome] = codigoDe(g('cod'), bruto);
      if (!cod) {
        if (norm(bruto).startsWith('filtros') || (texto(g('estoque')) === '' && texto(g('media')) === '')) continue;
        semCod++;
      }
      const diasTxt = norm(g('dias'));
      const sem = diasTxt.startsWith('semgiro') ? 'Sem giro' : (diasTxt.startsWith('semmedia') || diasTxt.includes('incalcul')) ? 'Sem média' : '';
      const os = texto(g('os')).replace(/\.0+$/, '').replace(/\.$/, '');
      const et = texto(g('etapa'));
      const ent = col.entrega === undefined ? null : num(g('entrega'));
      itens.push([cod, nome, cliente(nome), num(g('media')), num(g('cx')), num(g('estoque')), num(g('emp')), os, et ? et[0].toUpperCase() + et.slice(1).toLowerCase() : '', texto(g('prev')), texto(g('obs')), sem, ent]);
    }
    if (!itens.length) throw new Error('A planilha não tem nenhuma linha de produto abaixo do cabeçalho.');
    return { itens, col, aba: t.aba, semCod, semCli: itens.filter((x) => !x[2]).length };
  }

  async function importarOS(file) {
    const wb = await lerArquivo(file);
    const t = acharTabela(wb, (h) => h.some((x) => MAP_OS.os.slice(0, 6).includes(x)));
    if (!t) throw new Error('Não achei a coluna de OS nas primeiras linhas. A planilha precisa ter uma coluna chamada “OS” (ou “Nº OS”, “Ordem de serviço”).');
    const col = acharColunas(t.rows[t.hi], MAP_OS);
    if (col.cod === undefined && col.nome === undefined) throw new Error('Não achei a coluna do produto. A planilha de OS precisa de uma coluna “Código” ou “Descrição produto” para ligar cada OS ao produto.');
    const mapa = new Map();
    for (let i = t.hi + 1; i < t.rows.length; i++) {
      const r = t.rows[i]; const g = (c) => col[c] === undefined ? '' : r[col[c]];
      const os = texto(g('os')).replace(/\.0+$/, '').replace(/\.$/, '');
      if (!os || norm(os) === 'os') continue;
      const [cod] = codigoDe(g('cod'), g('nome'));
      if (!cod) continue;
      const et = texto(g('etapa'));
      mapa.set(cod, { os, etapa: et ? et[0].toUpperCase() + et.slice(1).toLowerCase() : '', prev: texto(g('prev')) });
    }
    if (!mapa.size) throw new Error('Não achei nenhuma OS ligada a um código de produto na planilha.');
    return { mapa, col, aba: t.aba };
  }

  // Atualiza os produtos que já estão no site, pelo código. Campos que a planilha não traz ficam como estão.
  function mesclarEstoque(res) {
    const doArq = new Map(); res.itens.forEach((x) => { if (x[0] && !doArq.has(x[0])) doArq.set(x[0], x); });
    const c = res.col; const out = {}; const usados = new Set(); let atual = 0, faltaram = 0;
    for (const t of ['jit', 'gen']) {
      const doc = state.docs[t]; if (!doc || !doc.itens.length) continue;
      let n = 0;
      const itens = doc.itens.map((x) => {
        const f = doArq.get(x[0]);
        if (!f) { faltaram++; return x; }
        usados.add(x[0]); n++;
        const y = x.slice();
        y[3] = f[3]; y[5] = f[5]; y[6] = f[6]; y[11] = f[11];
        if (c.cx !== undefined) y[4] = f[4];
        if (c.os !== undefined) y[7] = f[7];
        if (c.etapa !== undefined) y[8] = f[8];
        if (c.prev !== undefined) y[9] = f[9];
        if (c.obs !== undefined) y[10] = f[10];
        if (c.entrega !== undefined) y[12] = f[12];
        return y;
      });
      out[t] = { itens, n }; atual += n;
    }
    const novos = res.itens.filter((x) => x[0] && !usados.has(x[0]));
    return { out, atual, faltaram, novos };
  }

  function chips(col, map, obrig) {
    if (obrig) return Object.keys(map).map((c) => col[c] !== undefined ? '<span class="col ok">' + (NOMES[c] || c) + '</span>' : obrig.includes(c) ? '<span class="col miss">' + (NOMES[c] || c) + ' (não achei)</span>' : '<span class="col">' + (NOMES[c] || c) + ': mantém o do site</span>').join(''); return Object.keys(map).map((c) => '<span class="col ' + (col[c] !== undefined ? 'ok' : 'miss') + '">' + (NOMES[c] || c) + (col[c] !== undefined ? '' : ' (não achei)') + '</span>').join(''); }

  function dialogo(html) {
    layer.innerHTML = '<div class="overlay center" data-close><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">' + html + '</div></div>';

  let modo = 'estoque';

  $('imp-os').addEventListener('click', () => { modo = 'os'; $('file').value = ''; $('file').click(); });
  $('file').addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const aba = state.tab; const nomeAba = aba === 'jit' ? 'produtos JIT' : 'genéricos';
    try {

        const antes = new Map(); Object.values(state.docs).forEach((d) => d && d.itens.forEach((x) => { if (!antes.has(x[0])) antes.set(x[0], x); }));
        const amostra = vazio ? res.itens.slice(0, 5) : res.itens.filter((x) => antes.has(x[0])).slice(0, 5);

          + '<div class="cols">' + chips(res.col, MAP_EST, ['nome', 'media', 'estoque', 'emp']) + '</div>'
          + (res.semCod ? '<p class="warn">' + res.semCod + ' linhas vieram sem código e não dá para ligá-las a nenhum produto.</p>' : '')
          + '<div class="prev"><table><thead><tr><th>Descrição produto</th><th class="n">Estoque</th><th class="n">Empenhado</th><th class="n">Média</th>' + (ent ? '<th class="n">Entrega pendente</th>' : '') + '</tr></thead><tbody>'
          + amostra.map((x) => { const v = antes.get(x[0]); return '<tr><td style="white-space:normal">' + esc(x[0]) + ' - ' + esc(x[1]) + '</td><td class="n">' + (v && v[5] !== x[5] ? '<span class="muted">' + fmt(v[5]) + ' → </span>' : '') + fmt(x[5]) + '</td><td class="n">' + fmt(x[6]) + '</td><td class="n">' + fmt(x[3]) + '</td>' + (ent ? '<td class="n">' + fmt(x[12] || 0) + '</td>' : '') + '</tr>'; }).join('')
          + '</tbody></table></div><p class="meta">Mostrando 5 produtos como exemplo.</p>'
          + '<div class="row-end"><button class="btn quiet" type="button" data-cancel>Cancelar</button><button class="btn solid" type="button" id="ok">' + (vazio ? 'Carregar ' + res.itens.length + ' produtos' : 'Atualizar ' + mx.atual + ' produtos') + '</button></div>');
        $('ok').addEventListener('click', async () => {
          const addNovos = !!($('add-novos') && $('add-novos').checked);

          const agora = new Date().toISOString();

  // ---------- relatório "Itens até 45 dias" ----------
  const REL_PADRAO = { prioridades: '', excluirClientes: ['Bar do Alemão SP'] };
  function relConfig() { return Object.assign({}, REL_PADRAO, state.relCfg || {}); }
  function relItens(cfg) {
    const prio = new Set(String(cfg.prioridades || '').split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean));
    const fora = new Set(cfg.excluirClientes || []);
    const out = []; let base = null; let tirPrio = 0;
    for (const t of ['jit', 'gen']) {
      const doc = state.docs[t]; if (!doc) continue;
      if (doc.atualizadoEm && (!base || doc.atualizadoEm > base)) base = doc.atualizadoEm;
      doc.itens.forEach((it, i) => {
        const r = computa(it, i, doc.atualizadoEm);
        if (r.semGiro || !r.os) return;
        const dias = Math.round(r.cob);
        if (dias > 45) return;
        if (fora.has(r.cli)) return;
        if (prio.has(String(r.cod))) { tirPrio++; return; }
        out.push(Object.assign({}, r, { diasN: dias }));
      });
    }
    out.sort((a, b) => a.cob - b.cob);
    return { itens: out, base, tirPrio, prioQtd: prio.size };
  }

  // ---------- relatório semanal (compara duas fotos do histórico) ----------
  const isoDia = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const diaBR = (s) => dataBR(isoDia(s));
  const pct = (a, b) => a > 0 ? (b - a) / a * 100 : (b > 0 ? null : 0);
  const pctTxt = (v) => v === null ? '—' : (v > 0 ? '+' : '') + v.toFixed(0).replace('-0', '0') + '%';
  const diasCap = (r) => r.semGiro ? null : Math.max(-999, Math.min(999, Math.round(r.cob)));
  const SIT = [['falta', 'Em ruptura'], ['critico', 'Crítico'], ['atencao', 'Atenção'], ['ok', 'Em dia']];

  function compararFotos(dA, dB) {
    const mapa = (doc) => { const m = new Map(); (doc.itens || []).forEach((it, i) => { if (it[0] && !m.has(it[0])) m.set(it[0], computa(it, i, doc.atualizadoEm)); }); return m; };
    const A = mapa(dA), B = mapa(dB);
    const linhas = [];
    B.forEach((b, cod) => {
      const a = A.get(cod); if (!a) return;
      if (a.semGiro && b.semGiro) return;
      const da = diasCap(a), db = diasCap(b);
      linhas.push({ cod, nome: b.nome, cli: b.cli, os: b.os, a, b, estA: a.estoque, estB: b.estoque, dispA: a.disp, dispB: b.disp,
        diasA: da, diasB: db, dDias: (db ?? 0) - (da ?? 0), varEst: pct(a.estoque, b.estoque) });
    });
    const validos = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro);
    const conta = (lado) => { const c = { falta: 0, critico: 0, atencao: 0, ok: 0 }; validos.forEach((l) => { const r = l[lado]; const st = !r.semGiro && r.disp <= 0 ? 'falta' : r.st; if (c[st] !== undefined) c[st]++; }); return c; };
    const sit = { a: conta('a'), b: conta('b') };
    const ruptA = sit.a.falta, ruptB = sit.b.falta;
    const sairam = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro && l.dispA <= 0 && l.dispB > 0).sort((x, y) => y.dispB - x.dispB);
    const entraram = linhas.filter((l) => !l.a.semGiro && !l.b.semGiro && l.dispA > 0 && l.dispB <= 0).sort((x, y) => x.dispB - y.dispB);
    const melhoraram = validos.filter((l) => l.dDias > 0 && l.dispB > l.dispA).sort((x, y) => y.dDias - x.dDias);
    const pioraram = validos.filter((l) => l.dDias < 0 && l.dispB < l.dispA).sort((x, y) => x.dDias - y.dDias);
    const somaA = linhas.reduce((s, l) => s + l.estA, 0), somaB = linhas.reduce((s, l) => s + l.estB, 0);
    return { linhas, validos: validos.length, foraGiro: linhas.length - validos.length, sit, ruptA, ruptB, sairam, entraram, melhoraram, pioraram, somaA, somaB };
  }

  function grafSituacao(pdf, x, y, w, h, sit, rotA, rotB, cores) {
    const max = Math.max(1, ...SIT.map(([k]) => Math.max(sit.a[k], sit.b[k])));
    const topo = Math.ceil(max / 10) * 10 || 10;
    const baseY = y + h - 8, alt = h - 16, grupo = w / SIT.length, bw = Math.min(12, grupo / 3.2);
    pdf.setDrawColor(225, 225, 225); pdf.setLineWidth(0.2);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(130, 130, 130);
    for (let i = 0; i <= 4; i++) { const v = topo * i / 4, yy = baseY - alt * i / 4; pdf.line(x, yy, x + w, yy); pdf.text(String(Math.round(v)), x - 1.5, yy + 1, { align: 'right' }); }
    SIT.forEach(([k, lab], i) => {
      const cx = x + grupo * i + grupo / 2;
      [[sit.a[k], [190, 190, 190]], [sit.b[k], cores[k]]].forEach(([v, cor], j) => {
        const hh = alt * v / topo, bx = cx - bw - 0.8 + j * (bw + 1.6);
        pdf.setFillColor(...cor); pdf.rect(bx, baseY - hh, bw, hh, 'F');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7); pdf.setTextColor(60, 60, 60);
        pdf.text(String(v), bx + bw / 2, baseY - hh - 1.3, { align: 'center' });
      });
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(60, 60, 60);
      pdf.text(lab, cx, baseY + 4.5, { align: 'center' });
    });
    pdf.setFillColor(190, 190, 190); pdf.rect(x + w - 62, y, 3, 3, 'F'); pdf.setFontSize(7); pdf.setTextColor(90, 90, 90); pdf.text(rotA, x + w - 58, y + 2.6);
    pdf.setFillColor(60, 60, 60); pdf.rect(x + w - 30, y, 3, 3, 'F'); pdf.text(rotB, x + w - 26, y + 2.6);
  }

  function grafMelhoras(pdf, x, y, w, lista, cor) {
    const top = lista.slice(0, 8); if (!top.length) return y;
    const max = Math.max(1, ...top.map((l) => l.dDias));
    const rotW = 70, bh = 4.2, gap = 2.6;
    top.forEach((l, i) => {
      const yy = y + i * (bh + gap);

      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.8); pdf.setTextColor(60, 60, 60);
      pdf.text(nome, x, yy + bh - 1);
      const bw = (w - rotW - 16) * l.dDias / max;
      pdf.setFillColor(...cor); pdf.rect(x + rotW, yy, Math.max(0.8, bw), bh, 'F');
      pdf.setFont('helvetica', 'bold'); pdf.text('+' + l.dDias + ' d', x + rotW + bw + 1.5, yy + bh - 1);
    });
    return y + top.length * (bh + gap);
  }

      pdf.setFillColor(...cor); pdf.rect(x, cy, 1.1, ch, 'F');
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...CINZA); pdf.text(lab, x + 4, cy + 5.5);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16); pdf.setTextColor(...cor); pdf.text(val, x + 4, cy + 13.5);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(...CINZA); pdf.text(sub, x + 4, cy + 18.3);
    });
    let y = cy + ch + 9;
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...TINTA); pdf.text('Produtos por situação', M, y);
    grafSituacao(pdf, M + 8, y + 3, W - 2 * M - 8, 58, cmp.sit, diaBR(fotoA), diaBR(fotoB), cores);
    y += 68;
    if (cmp.melhoraram.length) {
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...TINTA); pdf.text('Maiores ganhos em dias de estoque', M, y);
      y = grafMelhoras(pdf, M, y + 4, W - 2 * M, cmp.melhoraram, VERDE) + 6;
    }
    const tabela = (titulo, nota, linhas, cols, corCol) => {
      if (y > 250) { pdf.addPage(); y = 20; }
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...TINTA); pdf.text(titulo, M, y);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(...CINZA); pdf.text(nota, M, y + 4);
      if (!linhas.length) { pdf.setFontSize(8); pdf.text('Nenhum produto nesta situação no período.', M, y + 10); y += 18; return; }
      pdf.autoTable({
        startY: y + 6, margin: { left: M, right: M, top: 16, bottom: 16 },
        head: [cols.map((c) => c[0])], body: linhas.map((l) => cols.map((c) => c[1](l))),
        theme: 'plain',
        styles: { font: 'helvetica', fontSize: 7.4, textColor: TINTA, cellPadding: { top: 1.9, bottom: 1.9, left: 1.5, right: 1.5 }, lineColor: [228, 228, 228], valign: 'middle' },
        headStyles: { fontStyle: 'bold', fontSize: 6.3, textColor: CINZA, valign: 'bottom', lineWidth: { bottom: 0.4 }, lineColor: [60, 60, 60] },
        bodyStyles: { lineWidth: { bottom: 0.15 } },
        columnStyles: Object.fromEntries(cols.map((c, i) => [i, i === 0 ? { cellWidth: 'auto' } : { halign: 'right', cellWidth: c[2] || 18 }])),
        didParseCell: (d) => { if (d.section === 'head' && d.column.index > 0) d.cell.styles.halign = 'right'; if (d.section === 'body' && corCol && corCol[d.column.index]) { d.cell.styles.textColor = corCol[d.column.index](linhas[d.row.index]); d.cell.styles.fontStyle = 'bold'; } },
        showHead: 'everyPage'
      });
      y = pdf.lastAutoTable.finalY + 9;
    };
    const item = ['ITEM', (l) => l.cod + ' ' + l.nome];
    const dCor = (v) => v === null ? CINZA : v <= 0 ? VERM : v < 30 ? LAR : v <= 45 ? OURO : VERDE;
    const dTxt = (v) => v === null ? 'Sem giro' : String(v);
    tabela('Saíram da ruptura', 'Tinham disponível zerado ou negativo em ' + diaBR(fotoA) + ' e agora têm saldo.', cmp.sairam,
      [item, ['DISP.\nANTES', (l) => fmt(l.dispA)], ['DISP.\nAGORA', (l) => fmt(l.dispB)], ['DIAS\nAGORA', (l) => dTxt(l.diasB)], ['O.S', (l) => l.os || '—']],
      { 2: () => VERDE, 3: (l) => dCor(l.diasB) });
    tabela('Produtos que mais melhoraram', 'Maior ganho em dias de estoque. Variação do estoque em caixas entre as duas datas.', cmp.melhoraram.slice(0, 20),
      [item, ['ESTOQUE\nANTES', (l) => fmt(l.estA)], ['ESTOQUE\nAGORA', (l) => fmt(l.estB)], ['VARIAÇÃO', (l) => pctTxt(l.varEst)], ['DIAS\nANTES', (l) => dTxt(l.diasA)], ['DIAS\nAGORA', (l) => dTxt(l.diasB)]],
      { 3: (l) => l.varEst > 0 ? VERDE : CINZA, 5: (l) => dCor(l.diasB) });
    tabela('Entraram em ruptura', 'Tinham saldo em ' + diaBR(fotoA) + ' e agora estão com disponível zerado ou negativo.', cmp.entraram,
      [item, ['DISP.\nANTES', (l) => fmt(l.dispA)], ['DISP.\nAGORA', (l) => fmt(l.dispB)], ['O.S', (l) => l.os || '—']],
      { 2: () => VERM });
    tabela('Produtos que mais pioraram', 'Maior perda em dias de estoque.', cmp.pioraram.slice(0, 15),
      [item, ['ESTOQUE\nANTES', (l) => fmt(l.estA)], ['ESTOQUE\nAGORA', (l) => fmt(l.estB)], ['VARIAÇÃO', (l) => pctTxt(l.varEst)], ['DIAS\nANTES', (l) => dTxt(l.diasA)], ['DIAS\nAGORA', (l) => dTxt(l.diasB)]],
      { 3: (l) => l.varEst < 0 ? VERM : CINZA, 5: (l) => dCor(l.diasB) });
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(...CINZA);
    const nota = pdf.splitTextToSize('Compara as fotos do estoque salvas pelo site em ' + diaBR(fotoA) + ' e ' + diaBR(fotoB) + ', só com produtos que estão nas duas. Dias de estoque = disponível (estoque − empenhado) ÷ média mensal × 30. Itens "Sem giro" / "Sem média" em alguma das datas ficam fora das contagens e comparações (' + cmp.foraGiro + ' produtos neste período).', W - 2 * M);
    if (y + nota.length * 3.5 > 297 - 16) { pdf.addPage(); y = 20; }
    pdf.text(nota, M, y);
    const total = pdf.getNumberOfPages();
    for (let p = 1; p <= total; p++) { pdf.setPage(p); pdf.setFontSize(7); pdf.setTextColor(...CINZA); pdf.text('Página ' + p + ' de ' + total, W - M, 297 - 8, { align: 'right' }); }
    return pdf.output('blob');
  }

  function gerarSemanalXLSX(cmp, fotoA, fotoB, nomeAba) {
    const wb = XLSX.utils.book_new();
    const A = diaBR(fotoA), B = diaBR(fotoB);
    const add = (nome, linhas) => { const ws = XLSX.utils.aoa_to_sheet(linhas); ws['!cols'] = linhas[0].map((_, i) => ({ wch: i === 1 ? 58 : 14 })); XLSX.utils.book_append_sheet(wb, ws, nome); };
    const dv = (v) => v === null ? 'Sem giro' : v;
    add('Resumo', [['Relatório semanal de estoque', ''], ['Produtos', nomeAba], ['Período', A + ' a ' + B], [], ['Indicador', A, B],
      ...SIT.map(([k, l]) => [l, cmp.sit.a[k], cmp.sit.b[k]]), ['Estoque total (caixas)', cmp.somaA, cmp.somaB], [],
      ['Saíram da ruptura', cmp.sairam.length], ['Entraram em ruptura', cmp.entraram.length], ['Melhoraram', cmp.melhoraram.length], ['Pioraram', cmp.pioraram.length]]);
    const cab = ['Código', 'Descrição', 'Cliente', 'Estoque ' + A, 'Estoque ' + B, 'Variação estoque', 'Disponível ' + A, 'Disponível ' + B, 'Dias ' + A, 'Dias ' + B, 'Ganho em dias', 'OS'];
    const lin = (l) => [l.cod, l.nome, l.cli, l.estA, l.estB, l.varEst === null ? '' : l.varEst / 100, l.dispA, l.dispB, dv(l.diasA), dv(l.diasB), l.dDias, l.os || ''];
    add('Melhoraram', [cab, ...cmp.melhoraram.map(lin)]);
    add('Saíram da ruptura', [cab, ...cmp.sairam.map(lin)]);
    add('Pioraram', [cab, ...cmp.pioraram.map(lin)]);
    add('Entraram em ruptura', [cab, ...cmp.entraram.map(lin)]);
    add('Comparativo completo', [cab, ...cmp.linhas.slice().sort((x, y) => (x.b.cob) - (y.b.cob)).map(lin)]);
    ['Melhoraram', 'Saíram da ruptura', 'Pioraram', 'Entraram em ruptura', 'Comparativo completo'].forEach((n) => {
      const ws = wb.Sheets[n]; const r = XLSX.utils.decode_range(ws['!ref']);
      for (let i = 1; i <= r.e.r; i++) { const c = ws[XLSX.utils.encode_cell({ r: i, c: 5 })]; if (c && c.t === 'n') c.z = '0%'; }
    });
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function baixar(blob, nome) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

  $('semanal').addEventListener('click', async () => {
    const aba = state.tab; const nomeAba = aba === 'jit' ? 'produtos JIT' : 'genéricos';
    const { data: dias, error } = await sb.from('estoque_pcp_historico').select('dia').eq('tab', aba).order('dia', { ascending: false });
    if (error) { toast('Não deu para ler o histórico. Confira a conexão e tente de novo.', true); return; }
    const lista = (dias || []).map((d) => d.dia);
    if (lista.length < 2) {
      dialogo('<h2 id="dlg-t">Relatório semanal</h2><p class="meta">O relatório compara duas fotos do estoque dos ' + nomeAba + '. ' + (lista.length ? 'Por enquanto só existe a de ' + diaBR(lista[0]) + '.' : 'Ainda não há nenhuma foto salva.') + ' O site guarda uma foto a cada importação da planilha de estoque; depois da próxima importação o relatório já fica disponível.</p><div class="row-end"><button class="btn solid" type="button" data-cancel>Entendi</button></div>');
      return;
    }
    const fim = lista[0];
    const alvo = new Date(isoDia(fim)); alvo.setDate(alvo.getDate() - 7);
    const ini = lista.find((d) => isoDia(d) <= alvo) || lista[lista.length - 1];
    const opts = (sel) => lista.map((d) => '<option value="' + d + '"' + (d === sel ? ' selected' : '') + '>' + diaBR(d) + '</option>').join('');
    dialogo('<h2 id="dlg-t">Relatório semanal: ' + nomeAba + '</h2>'
      + '<p class="meta">Compara duas fotos do estoque: o que melhorou, o que piorou e quais produtos saíram ou entraram em ruptura.</p>'
      + '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><label class="field" for="sem-a">De<select id="sem-a" style="min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px">' + opts(ini) + '</select></label>'
      + '<label class="field" for="sem-b">Até<select id="sem-b" style="min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:15px">' + opts(fim) + '</select></label></div>'
      + '<div id="sem-prev" class="meta" aria-live="polite">Carregando…</div>'
      + '<div class="row-end"><button class="btn quiet" type="button" data-cancel>Cancelar</button><button class="btn" type="button" id="sem-xlsx" disabled>Baixar planilha Excel</button><button class="btn solid" type="button" id="sem-pdf" disabled>Baixar relatório em PDF</button></div>');
    const cache = {};
    const foto = async (d) => { if (cache[d]) return cache[d]; const { data, error: e } = await sb.from('estoque_pcp_historico').select('data').eq('tab', aba).eq('dia', d).single(); if (e) throw e; return (cache[d] = data.data); };
    let atual = null;
    const prever = async () => {
      const a = $('sem-a').value, b = $('sem-b').value;
      $('sem-pdf').disabled = $('sem-xlsx').disabled = true;
      if (a >= b) { $('sem-prev').innerHTML = '<span style="color:var(--falta)">Escolha uma data “De” anterior à data “Até”.</span>'; atual = null; return; }
      $('sem-prev').textContent = 'Carregando…';
      try {
        const [fa, fb] = await Promise.all([foto(a), foto(b)]);
        const cmp = compararFotos(fa, fb); atual = { cmp, a, b };
        $('sem-prev').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;color:var(--paper)">'
          + [['Em ruptura', cmp.ruptA + ' → ' + cmp.ruptB], ['Saíram da ruptura', cmp.sairam.length], ['Entraram em ruptura', cmp.entraram.length], ['Melhoraram', cmp.melhoraram.length], ['Pioraram', cmp.pioraram.length], ['Estoque total', pctTxt(pct(cmp.somaA, cmp.somaB))]]
            .map(([k, v]) => '<div style="padding:10px 12px;border:1px solid var(--line);border-radius:10px"><div class="meta" style="font-size:13px">' + k + '</div><b style="font-size:20px">' + v + '</b></div>').join('')
          + '</div>' + (cmp.melhoraram[0] ? '<p class="meta" style="margin-top:10px">Maior melhora: ' + esc(cmp.melhoraram[0].cod + ' ' + cmp.melhoraram[0].nome) + ' (+' + cmp.melhoraram[0].dDias + ' dias, estoque ' + pctTxt(cmp.melhoraram[0].varEst) + ').</p>' : '');
        $('sem-pdf').disabled = $('sem-xlsx').disabled = false;
      } catch (e) { $('sem-prev').innerHTML = '<span style="color:var(--falta)">Não deu para carregar as fotos. Tente de novo.</span>'; }
    };
    $('sem-a').addEventListener('change', prever); $('sem-b').addEventListener('change', prever);
    const nomeBase = () => 'Relatorio semanal ' + (aba === 'jit' ? 'JIT' : 'Genericos') + ' ' + diaBR(atual.a).replace(/\//g, '-') + ' a ' + diaBR(atual.b).replace(/\//g, '-');
    $('sem-pdf').addEventListener('click', () => {
      if (!atual) return;
      if (!window.jspdf || !window.jspdf.jsPDF) { toast('O gerador de PDF não carregou. Recarregue a página e tente de novo.', true); return; }
      try { baixar(gerarSemanalPDF(atual.cmp, atual.a, atual.b, nomeAba), nomeBase() + '.pdf'); toast('Relatório semanal baixado.'); } catch (e) { toast('Não deu para gerar o PDF. Tente de novo.', true); }
    });
    $('sem-xlsx').addEventListener('click', () => {
      if (!atual) return;
      try { baixar(gerarSemanalXLSX(atual.cmp, atual.a, atual.b, nomeAba), nomeBase() + '.xlsx'); toast('Planilha do relatório semanal baixada.'); } catch (e) { toast('Não deu para gerar a planilha. Tente de novo.', true); }
    });
    prever();
  });

  // ---------- dados (Supabase) ----------
  const SUPA_URL = 'https://mnvyitxutjvsoqgfftxn.supabase.co';
  const SUPA_KEY = 'sb_publishable_Oxodo29Euz7H_cCA1fRNCQ_Iobo-dqp';
  const sb = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;
  const linhas = {};
  function aplicar(id, data) {
    linhas[id] = data;
    if (id === 'jit' || id === 'gen') state.docs[id] = data && Array.isArray(data.itens) ? data : null;
    if (id === 'os') state.osInfo = data;
    if (id === 'config') state.relCfg = data;
  }
  async function gravar(id, data) {
    const { error } = await sb.from('estoque_pcp').upsert({ id, data }, { onConflict: 'id' });
    if (error) throw error;
    aplicar(id, data);
    rerender(id === state.tab);
  }
  state.db = {
    doc: (path) => {
      const id = path.split('/')[1];
      return {
        set: (data) => gravar(id, data),
        update: (parte) => gravar(id, Object.assign({}, linhas[id] || {}, parte))
      };
    }
  };
  async function carregar() {
    const { data, error } = await sb.from('estoque_pcp').select('id,data');
    if (error) { $('conn').textContent = 'Não deu para carregar os dados. Recarregue a página.'; return; }
    ['jit', 'gen', 'os', 'config'].forEach((id) => aplicar(id, null));
    (data || []).forEach((r) => aplicar(r.id, r.data));
    rerender(true);
  }
  let canal = null;
  function ouvir() {
    if (canal) return;
    canal = sb.channel('estoque_pcp').on('postgres_changes', { event: '*', schema: 'public', table: 'estoque_pcp' }, (p) => {
      if (p.new && p.new.id) { aplicar(p.new.id, p.new.data); rerender(p.new.id === state.tab); }
    }).subscribe();
  }
  function telaLogin(msg) {
    layer.innerHTML = '<div class="overlay center"><form class="dialog login" id="login" novalidate aria-labelledby="lg-t">'
      + '<span class="seal" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></span>'
      + '<h2 id="lg-t">Entrar no Controle Estoque PCP</h2>'
      + '<p class="meta">Use o mesmo usuário e senha dos outros painéis da ProFood.</p>'
      + (msg ? '<p class="err" role="alert">' + esc(msg) + '</p>' : '')
      + '<label class="field" for="lg-user">Usuário<input id="lg-user" autocomplete="username" placeholder="Ex.: matheuspcp" required></label>'
      + '<label class="field" for="lg-pass">Senha<input id="lg-pass" type="password" autocomplete="current-password" required></label>'
      + '<button class="btn solid" type="submit" id="lg-ok" style="justify-content:center">Entrar</button>'
      + '</form></div>';
    $('lg-user').focus();
    $('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      let u = $('lg-user').value.trim().toLowerCase(); const s = $('lg-pass').value;
      if (!u || !s) { telaLogin('Preencha o usuário e a senha.'); return; }
      if (!u.includes('@')) u += '@profood.local';
      $('lg-ok').disabled = true; $('lg-ok').textContent = 'Entrando…';
      const { error } = await sb.auth.signInWithPassword({ email: u, password: s });
      if (error) { telaLogin('Usuário ou senha incorretos. Confira e tente de novo.'); return; }
    });
  }
  async function entrou(session) {
    fechar();
    const email = session.user.email || '';
    const { data: pode } = await sb.rpc('estoque_pcp_pode');
    state.canEdit = !!pode;
    $('conn').innerHTML = '<span>' + esc(email.replace('@profood.local', '')) + '</span> <button class="btn quiet" type="button" id="sair" style="min-height:36px;padding:0 12px;margin-left:8px">Sair</button>';
    $('sair').addEventListener('click', async () => { await sb.auth.signOut(); });
    if (!pode) { $('conn').insertAdjacentHTML('afterbegin', '<span style="color:var(--falta)">Este usuário não tem acesso ao estoque. </span>'); render(); return; }
    await carregar();
    ouvir();
  }

  render();
  if (!sb) { $('conn').textContent = 'O banco de dados não carregou. Confira a internet e recarregue a página.'; }
  else {
    $('conn').textContent = '';
    sb.auth.onAuthStateChange((ev, session) => {
      if (session && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(() => entrou(session), 0);
      if (!session) { if (canal) { sb.removeChannel(canal); canal = null; } state.canEdit = false; ['jit', 'gen', 'os', 'config'].forEach((id) => aplicar(id, null)); $('conn').textContent = ''; render(); telaLogin(); }
    });
  }
})();
</script>
